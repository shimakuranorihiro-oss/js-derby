                    if (horse.skillTimer > 0) accelRatio *= 1.8; 

                    if (horse.currentStamina < 20) {
                        accelRatio = 0.005 + (accelRatio - 0.005) * (horse.currentStamina / 20);
                    }
                    
                    let targetAccel = speedDiff * accelRatio;

                    let isPathClear = true;
                    for (let other of blockingHorses) {
                        let distDiffOther = other.run_dist - horse.run_dist;
                        if (distDiffOther > 0 && distDiffOther < 15 && Math.abs(other.lane - horse.lane) < requiredClearance) {
                            isPathClear = false;
                            break;
                        }
                    }
                    
                    if (!isPathClear && horse.skillTimer <= 0) {
                        targetAccel *= 0.15; 
                        horse.isStressed = true;
                    }

                    let maxAccelLimit = (horse.accelType === 'sharp') ? 0.008 : 0.004;
                    if (horse.makuriTriggered && currentCourseId === 'sonoda') maxAccelLimit = 0.0015; 
                    if (horse.skillTimer > 0) maxAccelLimit *= 1.5;
                    
                    acceleration = Math.min(targetAccel, maxAccelLimit);

                    // 急加速ペナルティをマイルドに（400.0 -> 250.0、1.2 -> 1.1）
                    let accelCost = (acceleration * 1.1) + (Math.pow(acceleration, 2) * 250.0); 
                    horse.currentStamina -= accelCost * speedMultiplier;
                }
            } else {
                if (horse.currentStamina <= 0) {
                    let decelDrag;
                    if (currentCourseId === 'basic') {
                        let ex = horse.exhaustion;
                        if (ex < 30) {
                            decelDrag = 0.05 + (ex * 0.001); 
                        } else if (ex < 60) {
                            decelDrag = 0.08 + ((ex - 30) * 0.002); 
                        } else {
                            decelDrag = Math.min(0.20, 0.14 + ((ex - 60) * 0.002)); 
                        }
                    } else {
                        let ex = horse.exhaustion;
                        if (ex < 30) {
                            decelDrag = 0.06 + (ex * 0.0015); 
                        } else if (ex < 60) {
                            decelDrag = 0.10 + ((ex - 30) * 0.002); 
                        } else {
                            decelDrag = Math.min(0.25, 0.16 + ((ex - 60) * 0.003)); 
                        }
                    }
                    acceleration = speedDiff * decelDrag; 
                } else {
                    acceleration = speedDiff * 0.3; 
                }
            }
            
            horse.currentVelocity += acceleration;

            // 基本スタミナ消費倍率（baseDrainRate）をマイルドに調整
            let baseDrainRate = currentCourseId === 'basic' ? 0.038 : 0.044; 
            let distFactor = 2400 / total_dist;
            if (total_dist > 2400) distFactor = Math.pow(distFactor, 1.05); 
            else if (total_dist < 2400) distFactor = Math.pow(distFactor, 0.85); // 0.88 -> 0.85 (短い距離ほどスタミナに余裕を持たせる)
            const staminaDrainRate = baseDrainRate * distFactor; 
            
            let cornerPenalty = 1.0;
            if (currentCourseId === 'sonoda') {
                let C = COURSES.sonoda.C;
                let L = COURSES.sonoda.L;
                let R = COURSES.sonoda.R;
                let currentPos = (horse.run_dist + COURSES.sonoda.start_dist) % C;
                let isCorner = (currentPos >= L && currentPos < L + Math.PI * R) || (currentPos >= 2 * L + Math.PI * R);
                
                if (isCorner && horse.lane > 8.5) {
                    cornerPenalty = 1.0 + (horse.lane - 8.5) * 0.015; 
                }
            }
            
            horse.currentStamina -= staminaCost * horse.currentVelocity * staminaDrainRate * cornerPenalty * speedMultiplier;
            
            if (horse.currentStamina < 0) horse.currentStamina = 0;

            horse.run_dist += horse.currentVelocity * speedMultiplier;
        }

        // ==========================================
        // シミュレーション（1000回 / 1万回 共通ロジック）
        // ==========================================
        
        function simulateRaceComplete(raceHorses, dist) {
            let simPace = determinePace(raceHorses, dist);

            let simHorses = raceHorses.map((h, index) => {
                let randomFactor = -Math.log(-Math.log(Math.random())); 
                let winRate = h.simWinRate || h.currentWinRate;
                let power = (Math.pow(winRate, 0.6) * 12.0) + (randomFactor * 2.8); 
                let baseCondition = 0.90 + (power * 0.015);
                baseCondition = Math.max(0.80, Math.min(baseCondition, 1.25));
                
                let condStatMod = h.simConditionStatMod || h.condition.statMod;
                let raceCondition = baseCondition * condStatMod;
                
                let { speedMod, staminaMod } = applyAptitudeToHorse(h);

                let initialSpeed = h.speedBase * raceCondition * speedMod;
                let actualStamina = h.maxStamina * raceCondition * staminaMod;

                let sDelay = Math.random() < 0.15 ? 10 + Math.random() * 15 : Math.random() * 5;

                let makuriProb = 0;
                let ikkiProb = 0;
                if (h.type === 'sashi' || h.type === 'oikomi') {
                    makuriProb = currentCourseId === 'sonoda' ? 0.5 : 0.05; 
                    ikkiProb = currentCourseId === 'sonoda' ? 0.05 : 0.4;
                    if (h.skillName === '不沈艦、抜錨！' || h.skillName === '大まくり') { makuriProb += currentCourseId === 'sonoda' ? 0.4 : 0.3; }
                    if (h.skillName === '飛ぶような末脚' || h.skillName === '鬼の末脚' || h.skillName === '世界一の末脚' || h.skillName === '豪快な差し切り' || h.skillName === '鬼脚炸裂') { ikkiProb += 0.4; }
                }
                
                let isMakuri = false;
                let isChokusenIkki = false;
                let rType = Math.random();
                if (rType < makuriProb) {
                    isMakuri = true;
                } else if (rType > 1.0 - ikkiProb) {
                    isChokusenIkki = true;
                }

                return { 
                    ...h, 
                    run_dist: 0, 
                    lane: index, 
                    currentStamina: actualStamina,
                    actualSpeedBase: initialSpeed, 
                    currentVelocity: initialSpeed, 
                    isSweating: false,
                    isDrafting: false, 
                    isStressed: false, 
                    blocked: false,
                    isBattling: false,
                    exhaustion: 0,
                    exhaustLevel: 0,
                    startDelay: sDelay,
                    isMakuri: isMakuri,
                    isChokusenIkki: isChokusenIkki,
                    makuriTriggered: false,
                    makuriProgress: 0,
                    accelType: h.accelType,
                    finalTargetLane: undefined
                };
            });

            let isFinished = false;
            let maxTicks = 20000; 
            let ticks = 0;

            let finalStraightLen = COURSES[currentCourseId].L;

            while (!isFinished && ticks < maxTicks) {
                ticks++;
                let cLeader = simHorses[0];
                for(let i=1; i<simHorses.length; i++) {
                    if(simHorses[i].run_dist > cLeader.run_dist) cLeader = simHorses[i];
                }

                let currentDist = cLeader.run_dist;
                let remainToGoal = dist - currentDist;
                let speedMultiplier = 1.0;
                
                if (currentCourseId === 'sonoda') {
                    if (remainToGoal <= finalStraightLen) {
                        speedMultiplier = 0.18; 
                    } else if (remainToGoal <= finalStraightLen + 300) {
                        let ratio = (remainToGoal - finalStraightLen) / 300;
                        speedMultiplier = 0.18 + (0.42 * ratio); 
                    } else if (currentDist < 400) {
                        speedMultiplier = 0.45;
                    } else if (currentDist < 800) {
                        let ratio = (currentDist - 400) / 400;
                        speedMultiplier = 0.45 + (0.35 * ratio); 
                    } else {
                        speedMultiplier = 0.8;
                    }
                } else {
                    if (remainToGoal <= finalStraightLen) {
                        speedMultiplier = 0.20; 
                    } else if (remainToGoal <= 1000) {
                        let ratio = (remainToGoal - finalStraightLen) / (1000 - finalStraightLen);
                        speedMultiplier = 0.20 + (0.45 * ratio); 
                    } else if (currentDist < 400) {
                        speedMultiplier = 0.5;
                    } else if (currentDist < 800) {
                        let ratio = (currentDist - 400) / 400;
                        speedMultiplier = 0.5 + (0.3 * ratio); 
                    } else {
                        speedMultiplier = 0.9;
                    }
                }

                for(let i=0; i<simHorses.length; i++) {
                    let horse = simHorses[i];
                    moveHorse(horse, simHorses, cLeader, simPace, speedMultiplier, true);
                    if (horse.run_dist >= dist) {
                        isFinished = true;
                    }
                }
            }
            
            return simHorses.sort((a, b) => b.run_dist - a.run_dist);
        }

        function simulateSingleRace() {
            let result = simulateRaceComplete(currentHorses, total_dist);
            return result[0];
        }

        function prepareRandomRaceHorses() {
            let shuffled = [...horsesPool].sort(() => Math.random() - 0.5);
            let selected = shuffled.slice(0, 18);
            
            let totalWinRate = 0;
            selected.forEach(horse => {
                let cond = getRandomCondition();
                horse.simConditionStatMod = cond.statMod;
                
                let modWinRate = horse.baseWinRate;
                if (currentSurface === 'dirt' && horse.surf === 'turf') modWinRate *= 0.2; 
                if (currentSurface === 'turf' && horse.surf === 'dirt') modWinRate *= 0.2; 
                if (horse.surf === 'both') modWinRate *= 0.9; 
                if (currentSurface === horse.surf) modWinRate *= 1.2;

                if (total_dist < horse.distMin) modWinRate *= 0.4; 
                else if (total_dist > horse.distMax) modWinRate *= 0.3; 
                else modWinRate *= 1.2; 

                modWinRate *= cond.winMod;
                horse.tmpWinRate = Math.max(0.001, modWinRate); 
                totalWinRate += horse.tmpWinRate;
            });

            selected.forEach(horse => {
                horse.simWinRate = horse.tmpWinRate / totalWinRate;
            });
            return selected;
        }

        function downloadCSV(statsObj) {
            let csvContent = "\uFEFF"; 
            csvContent += "馬名,コース,距離,脚質,出走回数,1着,2着,3着,4着以下,勝率,連対率,複勝率\n";
            
            let sortedKeys = Object.keys(statsObj).sort((a, b) => statsObj[b].first - statsObj[a].first);
            
            sortedKeys.forEach(name => {
                let st = statsObj[name];
                if(st.starts === 0) return;
                let winRate = (st.first / st.starts * 100).toFixed(2) + "%";
                let rentaiRate = ((st.first + st.second) / st.starts * 100).toFixed(2) + "%";
                let fukushoRate = ((st.first + st.second + st.third) / st.starts * 100).toFixed(2) + "%";
                
                let row = `${name},${COURSES[currentCourseId].name},${total_dist}m,${typeName[st.type]},${st.starts},${st.first},${st.second},${st.third},${st.out},${winRate},${rentaiRate},${fukushoRate}`;
                csvContent += row + "\n";
            });
            
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `JSダービー_1万回シミュ_${COURSES[currentCourseId].name}_${total_dist}m.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

            globalSimBtn.disabled = true;

            });
            
            const totalSims = 10000;

            function runBatch() {
                for (let i = 0; i < batchSize && currentSim < totalSims; i++) {
                    let raceHorses = prepareRandomRaceHorses();
                    let result = simulateRaceComplete(raceHorses, total_dist);
                    
                    result.forEach((h, rank) => {
                        let st = stats[h.name];
                        st.starts++;
                        if (rank === 0) st.first++;
                        else if (rank === 1) st.second++;
                        else if (rank === 2) st.third++;
                        else st.out++;
                    });
                    currentSim++;
                }

                if (currentSim < totalSims) {
                    globalSimBtn.innerHTML = `⏳ ${currentSim} / ${totalSims}`;

                    globalSimBtn.innerHTML = originalText;

                    simBtn.disabled = false;

                }

        function startRaceProcess() {
            surfaceSelect.disabled = true;
            distanceSelect.disabled = true;
            skillSelect.disabled = true;
            demoBtn.disabled = true;
            shuffleDemoBtn.disabled = true;
            aiPredictionBtn.disabled = true;

                if (badStartHorses.length > 0) {
                    let worst = badStartHorses.reduce((prev, current) => (prev.startDelay > current.startDelay) ? prev : current);
                    commentary.innerText = `スタートしました！ おっと、${worst.name}が少し出遅れたか！？`;
                } else {
                    let surfaceText = currentSurface === 'turf' ? '芝' : 'ダート';
                    let courseName = COURSES[currentCourseId].name;
                    commentary.innerText = `各馬、綺麗なスタートを切りました！ ${courseName} ${surfaceText}${total_dist}mの戦いです。`;
                }

            }, 3000);

        function raceLoop() {
            if (!isRacing) return;
            frameCount++;
            
            if (frameCount > 0) {
                isGateMoving = true;
            }
            if (isGateMoving && gateOffset < 300) {
                gateOffset += 1.0; 
            }
            
            frameHistory.push({
                frame: frameCount,
                horses: horses.map(h => ({ run_dist: h.run_dist, lane: h.lane }))
            });
            if (frameHistory.length > 3000) frameHistory.shift(); 
            
            currentRanking = [...horses].sort((a, b) => {
                if (a.isGoal && b.isGoal) return a.finishOrder - b.finishOrder;
                if (a.isGoal) return -1;
                if (b.isGoal) return 1;
                return b.run_dist - a.run_dist;
            });
            
            let currentLeader = currentRanking[0];
            leaderHorse = currentLeader; 

            let currentDist = currentLeader.run_dist;
            let remainToGoal = total_dist - currentDist;
            let speedMultiplier = 1.0;
            
            let finalStraightLen = L;
            
            if (currentCourseId === 'sonoda') {
                if (remainToGoal <= finalStraightLen) {
                    speedMultiplier = 0.18; 
                } else if (remainToGoal <= finalStraightLen + 300) {
                    let ratio = (remainToGoal - finalStraightLen) / 300;
                    speedMultiplier = 0.18 + (0.42 * ratio); 
                } else if (currentDist < 400) {
                    speedMultiplier = 0.45;
                } else if (currentDist < 800) {
                    let ratio = (currentDist - 400) / 400;
                    speedMultiplier = 0.45 + (0.35 * ratio); 
                } else {
                    speedMultiplier = 0.8;
                }
            } else {
                if (remainToGoal <= finalStraightLen) {
                    speedMultiplier = 0.20; 
                } else if (remainToGoal <= 1000) {
                    let ratio = (remainToGoal - finalStraightLen) / (1000 - finalStraightLen);
                    speedMultiplier = 0.20 + (0.45 * ratio); 
                } else if (currentDist < 400) {
                    speedMultiplier = 0.5;
                } else if (currentDist < 800) {
                    let ratio = (currentDist - 400) / 400;
                    speedMultiplier = 0.5 + (0.3 * ratio); 
                } else {
                    speedMultiplier = 0.9;
                }
            }

            horses.forEach(horse => {
                if (horse.isGoal) {
                    let targetSpeed = horse.actualSpeedBase * 0.6;
                    let dist = start_dist + horse.run_dist;
                    let d = ((dist % C) + C) % C;
                    let isCorner = (d >= L && d < L + Math.PI * R) || (d >= 2 * L + Math.PI * R);
                    if (isCorner) {
                        let actualR = R + (horse.lane - 8.5) * LANE_WIDTH; 
                        targetSpeed *= (R / actualR); 
                    }
                    horse.currentVelocity += (targetSpeed - horse.currentVelocity) * 0.1;
                    horse.run_dist += horse.currentVelocity * speedMultiplier;
                    return; 
                }

                moveHorse(horse, horses, currentLeader, currentPace, speedMultiplier, false);

                if (horse.run_dist >= total_dist && !horse.isGoal) {
                    horse.isGoal = true;
                    horse.finishFrame = frameCount; 
                    finishedHorses.push(horse);
                    horse.finishOrder = finishedHorses.length;

                    let order = horse.finishOrder;
                    if (order === 1) {
                        let second = currentRanking.find(h => h !== horse && !h.isGoal);
                        if (second && (horse.run_dist - second.run_dist) <= 3.0) {
                            isPhotoFinishTriggered = true;
                            commentary.innerText = `ゴーーール！！ 1着争いは大接戦！ 写真判定か！？`;
                        } else if (second && (horse.run_dist - second.run_dist) < 15) {
                            commentary.innerText = `ゴーーール！！ 激しい叩き合いを制したのは ${horse.name} か！？`;
                        } else {
                            commentary.innerText = `1着でゴール板を駆け抜けたのは ${horse.name}！！`;
                        }
                        lastCommentaryTime = Date.now();
                    } else if (order === 2) {
                        if (!isPhotoFinishTriggered) {
                            commentary.innerText = `2着に ${horse.name} が入りました！`;
                            lastCommentaryTime = Date.now();
                        }
                    } else if (order === 3) {
                        if (!isPhotoFinishTriggered) {
                            commentary.innerText = `3着は ${horse.name}！`;
                            lastCommentaryTime = Date.now();
                        }
                    } else if (order === 4) {
                        if (!isPhotoFinishTriggered) {
                            commentary.innerText = `続いて4着に ${horse.name}。`;
                            lastCommentaryTime = Date.now();
                        }
                    } else if (order === 5) {
                        if (!isPhotoFinishTriggered) {
                            commentary.innerText = `そして5着に ${horse.name} が入線！`;
                            lastCommentaryTime = Date.now();
                        }
                    }
                }
            });

            draw();

            if (!isCoolDown) {
                if (finishedHorses.length < 5) {
                    updateCommentary();
                    animationId = requestAnimationFrame(raceLoop);
                } else {
                    const betHorseName = document.querySelector('input[name="horseSelect"]:checked').value;
                    const betAmount = parseInt(document.getElementById('betAmount').value);
                    finishRace(finishedHorses[0], betHorseName, betAmount);
                    
                    if (isRacing) {
                        animationId = requestAnimationFrame(raceLoop);
                    }
                }
            } else if (isRacing) {
                animationId = requestAnimationFrame(raceLoop);
            }
        }

            }

                type = "phase";
            }
            else if (remain <= 200 && remain > 100 && !announcedPhases['200m']) {
                announcedPhases['200m'] = true;
                text = `残り200m！ 一気に馬群が横に広がった！ ${top1.name} が粘る！ 後続は届くのか！？`;
                type = "phase";
            }
            else if (remain <= 100 && remain > 50 && !announcedPhases['100m']) {
                announcedPhases['100m'] = true;
                text = `残り100mを切った！ 意地と意地のぶつかり合い！！`;
                type = "phase";
            }
            else if (remain <= 50 && !announcedPhases['50m']) {
                announcedPhases['50m'] = true;
                text = `ゴール前、大激戦！！ 抜け出すのはどの馬か！？`;

            }

            if (!text) {
                if (prevLeader && prevLeader !== top1 && remain > 200) {
                    text = `おっと、ここで先頭が代わりました！ ${top1.name} が先頭に立ちます！`;

                }
                else if (makuriHorse && remain > 400 && remain <= 800) {

                else if (ikkiHorse && remain <= 400 && remain > 100) {

                    type = "event";

            if (!text && top1) {

                    if (r < 0.25 && lastCommentaryType !== "leader") {

                        text = `先手を奪ったのは ${top1.name}。リードは${diff}馬身といったところ。`;

                } else if (remain <= 800 && remain > 400) {

                        type = "leader_push";
                    } else if (r < 0.6 && top2 && top3 && lastCommentaryType !== "chaser_push") {
                        text = `${top2.name}、${top3.name} も前を射程圏内に捉えます！`;
                        type = "chaser_push";
                    } else if (favoriteHorse && favoriteHorse.run_dist < top1.run_dist - 15 && lastCommentaryType !== "favorite") {
                        let favRank = currentRanking.indexOf(favoriteHorse) + 1;
                        text = `1番人気の ${favoriteHorse.name} は現在${favRank}番手！ ここから届くのか！？`;
                        type = "favorite";
                    } else if (lastCommentaryType !== "closing") {
                         text = `後続も徐々に差を詰めてまいりました！`;
                         type = "closing";
                    }
                } else { 
                    if (r < 0.33 && top2 && lastCommentaryType !== "stretch_battle") {
                        text = `${top1.name} と ${top2.name} の激しい叩き合い！`;
                        type = "stretch_battle";
                    } else if (r < 0.66 && top3 && top3.currentVelocity > top1.currentVelocity && lastCommentaryType !== "stretch_come") {
                        text = `外から ${top3.name} も鋭く伸びてきた！！`;
                        type = "stretch_come";
                    } else if (lastCommentaryType !== "stretch_push") {
                        text = `逃げる ${top1.name} に後続が迫る！！`;
                        type = "stretch_push";
                    }
                }
            }

            prevLeader = top1;

            if (text && text !== commentary.innerText) {
                commentary.innerText = text;
                nowCommentaryTime = now;
                lastCommentaryTime = now;
                if (type) lastCommentaryType = type;
            }
        }

        function showPhotoFinishEffect(winner, betHorseName, betAmount, winFrame) {
            let framesToShow = [winFrame - 16, winFrame - 8, winFrame];
            let step = 0;

            function showNextFrame() {
                if (step < 3) {
                    let currentStep = step; 
                    let targetFrameNum = framesToShow[currentStep];
                    
                    let histObj = null;
                    if (frameHistory.length > 0) {
                        histObj = frameHistory.reduce((prev, curr) => 
                            Math.abs(curr.frame - targetFrameNum) < Math.abs(prev.frame - targetFrameNum) ? curr : prev
                        );
                    }
                    
                    if (histObj) {
                        horses.forEach((h, i) => {
                            h.run_dist = histObj.horses[i].run_dist;
                            h.lane = histObj.horses[i].lane;
                        });
                        
                        currentRanking = [...horses].sort((a, b) => b.run_dist - a.run_dist);
                        leaderHorse = currentRanking[0];
                        
                        let isFinalFrame = (currentStep === 2);
                        
                        let targetDist;
                        if (currentStep === 0) {
                            targetDist = total_dist - 12.0; 
                        } else if (currentStep === 1) {
                            targetDist = total_dist - 8.0;  
                        } else {
                            targetDist = total_dist - 4.4;  
                        }
                        
                        let diff = winner.run_dist - targetDist;
                        horses.forEach(h => {
                            h.run_dist -= diff; 
                        });

                        if (isFinalFrame) {
                            horses.forEach(h => {
                                if (h !== winner) {
                                    let distDiff = winner.run_dist - h.run_dist;
                                    if (distDiff <= 0.8) {
                                        h.run_dist = winner.run_dist - (0.3 + Math.random() * 0.3);
                                    }
                                }
                            });
                        }

                        let opacity = 1.0;
                        let flashEffect = setInterval(() => {
                            draw(currentStep); 
                            
                            ctx.save();
                            ctx.setTransform(1, 0, 0, 1, 0, 0); 
                            ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                            ctx.fillRect(0, 0, canvas.width, canvas.height);
                            
                            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                            ctx.fillRect(0, canvas.height - 60, canvas.width, 60);
                            ctx.fillStyle = '#fbbf24';
                            ctx.font = 'bold 24px sans-serif';
                            ctx.textAlign = 'center';
                            ctx.fillText('📸 P H O T O', canvas.width / 2, canvas.height - 25);
                            ctx.restore();
                            
                            opacity -= 0.15;
                            if (opacity <= 0) {
                                clearInterval(flashEffect);
                                draw(currentStep); 
                                
                                ctx.save();
                                ctx.setTransform(1, 0, 0, 1, 0, 0);
                                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                                ctx.fillRect(0, canvas.height - 60, canvas.width, 60);
                                ctx.fillStyle = '#fbbf24';
                                ctx.font = 'bold 24px sans-serif';
                                ctx.textAlign = 'center';
                                ctx.fillText('📸 P H O T O', canvas.width / 2, canvas.height - 25);
                                ctx.restore();
                            }
                        }, 30);
                    }
                    step++;
                    setTimeout(showNextFrame, 1200); 
                } else {
                    setTimeout(() => {
                        let lastHist = frameHistory[frameHistory.length - 1];
                        if (lastHist) {
                            horses.forEach((h, i) => {
                                h.run_dist = lastHist.horses[i].run_dist;
                                h.lane = lastHist.horses[i].lane;
                            });
                        }
                        
                        isCoolDown = true;
                        isRacing = true;
                        raceLoop();
                        
                        commentary.innerText = `写真判定の結果... 1着は見事 ${winner.horseNum}番 ${winner.name} です！`;
                        setTimeout(() => { 
                            isRacing = false;
                            showResult(winner, betHorseName, betAmount); 
                        }, 3500);
                    }, 2500);
                }
            }
            
            showNextFrame();
        }

        function finishRace(winner, betHorseName, betAmount) {
            if (isPhotoFinishTriggered) {
                isRacing = false; 
                commentary.innerText = `1着争いは大接戦！ 写真判定の確認に入ります！`;
                setTimeout(() => {
                    showPhotoFinishEffect(winner, betHorseName, betAmount, winner.finishFrame);
                }, 1500);
            } else {
                isCoolDown = true;
                commentary.innerText = `以上、上位5頭の入線をお伝えしました。素晴らしいレースでした！`;
                
                setTimeout(() => {
                    isRacing = false; 
                    showResult(winner, betHorseName, betAmount);
                }, 3500);
            }
        }

        function showResult(winner, betHorseName, betAmount) {
            let baseCameraScale = 1.0 / TRACK_SCALE;
            cameraScale = baseCameraScale * (currentCourseId === 'sonoda' ? 2.2 : 1.3); 
            cameraX = canvas.width * 0.5 - (500 * TRACK_SCALE) * cameraScale;
            if (currentCourseId === 'basic') {
                cameraX += 60 * TRACK_SCALE * cameraScale;
            }
            cameraY = canvas.height * 0.5 - (250 * TRACK_SCALE) * cameraScale;
            
            draw(-1); 
            
            betPanel.classList.remove('opacity-50', 'pointer-events-none');
            commentary.classList.add('hidden');
            resultPanel.classList.remove('hidden');
            setTimeout(() => { resultPanel.classList.remove('opacity-0', 'scale-95'); }, 50);
            
            surfaceSelect.disabled = false;
            distanceSelect.disabled = false;
            skillSelect.disabled = false;
            demoBtn.disabled = false;
            shuffleDemoBtn.disabled = false;
            aiPredictionBtn.disabled = false;

            let resultHtml = `<div class="text-left max-w-sm mx-auto mb-4 border-b pb-2">`;
            for (let i = 0; i < 5; i++) {
                let h = finishedHorses[i];
                if (i === 0) {
                    resultHtml += `<div class="text-xl md:text-2xl font-bold text-gray-800 mb-2"><span class="inline-block px-2 py-1 bg-yellow-300 rounded mr-2 border border-yellow-500 text-sm">1着</span> ${h.wakuNum}枠 ${h.horseNum}番 ${h.name}</div>`;
                } else {
                    resultHtml += `<div class="text-base md:text-lg text-gray-600 mb-1"><span class="inline-block px-2 py-0.5 bg-gray-200 rounded mr-2 text-xs border border-gray-300">${i+1}着</span> ${h.wakuNum}枠 ${h.horseNum}番 ${h.name}</div>`;
                }
            }
            resultHtml += `</div>`;
            resultWinner.innerHTML = resultHtml;
            
            if (isDemoMode) {
                resultPanel.className = "bg-white rounded-xl shadow-xl p-6 md:p-8 border-4 border-blue-400 text-center mb-6 transform transition-all duration-500 scale-100 opacity-100";
                resultTitle.innerText = "📺 デモレース終了 📺";
                resultTitle.className = "text-2xl md:text-3xl font-extrabold mb-4 text-blue-500";
                resultPayout.innerText = "観戦お疲れ様でした！";
                resultPayout.className = "text-2xl font-bold mb-8 text-blue-600";
            } else {
                if (winner.name === betHorseName) {
                    const payout = Math.floor(betAmount * winner.odds); 
                    updateMoney(payout);
                    
                    resultPanel.className = "bg-white rounded-xl shadow-xl p-6 md:p-8 border-4 border-green-500 text-center mb-6 transform transition-all duration-500 scale-100 opacity-100";
                    resultTitle.innerText = "🎉 的中！おめでとうございます 🎉";
                    resultTitle.className = "text-2xl md:text-3xl font-extrabold mb-4 text-green-600";
                    resultPayout.innerText = `+${payout} G 獲得！`;
                    resultPayout.className = "text-3xl md:text-4xl font-black mb-8 text-green-600";
                } else {
                    resultPanel.className = "bg-white rounded-xl shadow-xl p-6 md:p-8 border-4 border-gray-400 text-center mb-6 transform transition-all duration-500 scale-100 opacity-100";
                    resultTitle.innerText = "💦 ハズレ... 💦";
                    resultTitle.className = "text-2xl md:text-3xl font-extrabold mb-4 text-gray-700";
                    resultPayout.innerText = "残念！";
                    resultPayout.className = "text-2xl font-bold mb-8 text-gray-500";
                }

                if(money <= 0) {
                     document.getElementById('bankruptMsg').classList.remove('hidden');
                     nextBtn.disabled = true;
                     nextBtn.classList.add('opacity-50', 'cursor-not-allowed');
                }
            }
        }

        nextBtn.addEventListener('click', () => {
            if(money <= 0) return;
            resultPanel.classList.add('opacity-0', 'scale-95');
            setTimeout(() => {
                resultPanel.classList.add('hidden');
                prepareRaceData();
                generateOddsData();
                initUI();
                resetHorses();
                draw();
            }, 300);
        });

        // 起動時の初期化フロー
        switchCourse('basic');

    </script>
</body>
