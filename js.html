        function getRandomCondition() {
            let r = Math.random();
            if (r < 0.10) return conditionList[0]; 
            if (r < 0.35) return conditionList[1]; 
            if (r < 0.70) return conditionList[2]; 
            if (r < 0.90) return conditionList[3]; 
            return conditionList[4];

        function determinePace(raceHorses, dist) {
            let nigeHorses = raceHorses.filter(h => h.type === 'nige');
            let nigeCount = nigeHorses.length;
            let hasDaiNige = nigeHorses.some(h => h.skillName === '逆噴射の大逃げ' || h.skillName === '異次元の逃亡者' || h.speedBase >= 1.4);
            
            if (hasDaiNige && Math.random() < 0.25) return 'dainige'; 

            let r = Math.random();
            let probHigh = 0.33, probMid = 0.34, probSlow = 0.33;

            if (dist <= 1600) { probHigh = 0.70; probMid = 0.25; probSlow = 0.05; } 
            else if (dist >= 3000) { probHigh = 0.05; probMid = 0.25; probSlow = 0.70; } 
            else { probHigh = 0.25; probMid = 0.50; probSlow = 0.25; }

            if (hasDaiNige) { probHigh += 0.35; probSlow -= 0.15; }
            if (nigeCount === 0) { probSlow += 0.35; probHigh -= 0.15; } 
            else if (nigeCount >= 3) { probHigh += 0.25; probSlow -= 0.10; }

            let total = Math.max(0.01, probHigh) + Math.max(0.01, probMid) + Math.max(0.01, probSlow);
            probHigh = Math.max(0.01, probHigh) / total;
            probMid = Math.max(0.01, probMid) / total;
            
            if (r < probHigh) return 'high';
            if (r < probHigh + probMid) return 'middle';
            return 'slow';
        }

                if (dist === 1200) { distMin = 1000; distMax = 1400; }
                if (dist === 1600) { distMin = 1400; distMax = 2000; }
                if (dist === 3200) { distMin = 2400; distMax = 3600; }

                if (type === 'nige') { maxStamina *= 1.1; spurt *= 0.9; }
                if (type === 'oikomi') { maxStamina *= 0.9; spurt *= 1.2; }

                const coatsList = ['bay', 'darkBay', 'chestnut', 'gray', 'white'];
                let coat = coatsList[Math.floor(Math.random() * coatsList.length)];

        function prepareRaceData() {
            if (horsesPool.length === 0) setupHorsesPool();

            let shuffledPool = [...horsesPool].sort(() => Math.random() - 0.5);
            let raceHorseCount = Math.min(18, shuffledPool.length);
            currentHorses = shuffledPool.slice(0, raceHorseCount);

            let totalWinRate = 0;
            currentHorses.forEach((horse, index) => {
                horse.horseNum = index + 1; 
                
                let wakuIndex;
                if (index < 12) {
                    wakuIndex = Math.floor(index / 2);
                } else if (index < 15) {
                    wakuIndex = 6;
                } else {
                    wakuIndex = 7;
                }
                
                horse.wakuBg = wakuColors[wakuIndex].bg;
                horse.wakuText = wakuColors[wakuIndex].text;
                horse.wakuNum = wakuIndex + 1;
                horse.borderClass = wakuColors[wakuIndex].border;

                horse.condition = getRandomCondition();

                let modWinRate = horse.baseWinRate;
                
                if (currentSurface === 'dirt' && horse.surf === 'turf') modWinRate *= 0.2; 
                if (currentSurface === 'turf' && horse.surf === 'dirt') modWinRate *= 0.2; 
                if (horse.surf === 'both') modWinRate *= 0.9; 
                if (currentSurface === horse.surf) modWinRate *= 1.2;

                if (total_dist < horse.distMin) {
                    modWinRate *= 0.4; 
                } else if (total_dist > horse.distMax) {
                    modWinRate *= 0.3; 
                } else {
                    modWinRate *= 1.2; 
                }

                modWinRate *= horse.condition.winMod;
                horse.currentWinRate = Math.max(0.001, modWinRate); 
                totalWinRate += horse.currentWinRate;
            });

            currentHorses.forEach(horse => {
                horse.currentWinRate = horse.currentWinRate / totalWinRate;
                horse.odds = Math.max(1.1, Math.floor((payoutRate / horse.currentWinRate) * 10) / 10);

        function generateOddsData() {
            let sorted = [...currentHorses].sort((a, b) => a.odds - b.odds);
            trifectaOddsList = [];
            for(let i=0; i<4; i++) {
                for(let j=0; j<5; j++) {
                    for(let k=0; k<6; k++) {
                        if(i===j || j===k || i===k) continue;
                        let h1 = sorted[i]; let h2 = sorted[j]; let h3 = sorted[k];
                        
                        let P1 = h1.currentWinRate;
                        let P2 = h2.currentWinRate / (1 - P1);
                        let P3 = h3.currentWinRate / (1 - P1 - h2.currentWinRate);
                        let prob = P1 * P2 * P3;
                        let baseOdds = 0.725 / prob;
                        
                        trifectaOddsList.push({
                            name1: h1.horseNum, name2: h2.horseNum, name3: h3.horseNum,
                            odds: Math.max(1.1, Math.floor(baseOdds * 10) / 10)
                        });
                    }
                }
            }
            trifectaOddsList.sort((a, b) => a.odds - b.odds);
            trifectaOddsList = trifectaOddsList.slice(0, 4); 
        }

        // ==========================================
        // Gemini API AIパドック予想機能

        async function callGeminiAPI(prompt, systemInstruction = "") {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = { contents: [{ parts: [{ text: prompt }] }] };
            if (systemInstruction) {
                payload.systemInstruction = { parts: [{ text: systemInstruction }] };
            }

            let retries = 5;
            let delay = 1000;
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const result = await response.json();
                    return result.candidates?.[0]?.content?.parts?.[0]?.text || "予想を生成できませんでした。";
                } catch (error) {
                    if (i === retries - 1) return "AI予想の取得に失敗しました。時間をおいて再試行してください。";
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2;
                }
            }
        }

                let { speedMod, staminaMod } = applyAptitudeToHorse(h);

                let initialSpeed = h.speedBase * raceCondition * speedMod;
                let actualStamina = h.maxStamina * raceCondition * staminaMod;

                let sDelay = Math.random() < 0.15 ? 10 + Math.random() * 15 : Math.random() * 5;

                let makuriProb = 0;
                let ikkiProb = 0;
                if (h.type === 'sashi' || h.type === 'oikomi') {
                    makuriProb = currentCourseId === 'sonoda' ? 0.5 : 0.05; 
                    ikkiProb = currentCourseId === 'sonoda' ? 0.05 : 0.4;

                    if (h.skillName === '不沈艦、抜錨！' || h.skillName === '大まくり') {
                        makuriProb += currentCourseId === 'sonoda' ? 0.4 : 0.3;
                    }
                    if (h.skillName === '飛ぶような末脚' || h.skillName === '鬼の末脚' || h.skillName === '世界一の末脚' || h.skillName === '豪快な差し切り' || h.skillName === '鬼脚炸裂') {
                        ikkiProb += 0.4;
                    }
                }
                
                let isMakuri = false;
                let isChokusenIkki = false;
                let rType = Math.random();
                if (rType < makuriProb) {
                    isMakuri = true;
                } else if (rType > 1.0 - ikkiProb) {
                    isChokusenIkki = true;
                }

                return { 
                    ...h, 
                    run_dist: 0, 
                    lane: index, 
                    currentStamina: actualStamina,
                    actualSpeedBase: initialSpeed, 
                    currentVelocity: initialSpeed, 
                    isSweating: false,
                    isDrafting: false, 
                    isSandCovered: false, 
                    isStressed: false, 
                    blocked: false,
                    isBattling: false, 
                    isGoal: false,
                    finishOrder: 0,
                    exhaustion: 0, 
                    exhaustLevel: 0,
                    startDelay: sDelay,
                    skillUsed: false,
                    skillTimer: 0,
                    isMakuri: isMakuri,
                    isChokusenIkki: isChokusenIkki,
                    makuriTriggered: false,
                    makuriProgress: 0,
                    accelType: h.accelType,
                    finalTargetLane: undefined
                };
            });
            leaderHorse = horses[0];
            finishedHorses = [];
            currentRanking = [...horses];
            
            cameraScale = 1.0; 
            cameraX = 0; 
            cameraY = 0;
            cinemaBarHeight = 0;
            frameCount = 0;
            frameHistory = []; 
            isCoolDown = false; 
            activeSkillCutins = []; 
            
            gateOffset = 0;
            isGateMoving = false;
            isWaitingStart = false;
            waitingTicks = 0; 

            let sortedByOdds = [...currentHorses].sort((a, b) => a.odds - b.odds);
            let favName = sortedByOdds[0].name;
            favoriteHorse = horses.find(h => h.name === favName);
        }

        function updateMoney(amount) {
            money += amount;
            moneyDisplay.style.transform = 'scale(1.2)';
            moneyDisplay.style.color = amount >= 0 ? '#16a34a' : '#dc2626';
            moneyDisplay.innerText = money;
            setTimeout(() => {
                moneyDisplay.style.transform = 'scale(1)';
                moneyDisplay.style.color = '#16a34a';
            }, 300);
        }

        function getTrackPos(dist, lane) {
            const laneOffset = (lane - 8.5) * LANE_WIDTH; 
            let pocketInfo = COURSES[currentCourseId].getPocketStart(total_dist);
            
            if (pocketInfo && dist < pocketInfo.dist) {
                if (pocketInfo.type === 'left-top') {
                    let x = leftX - Math.abs(dist - pocketInfo.dist); 
                    let y = 250 - R - laneOffset;
                    return { x: x * TRACK_SCALE, y: y * TRACK_SCALE, isPocket: true, dir: 'left' };
                } else if (pocketInfo.type === 'right-bottom') {
                    let x = rightX + Math.abs(dist - pocketInfo.dist); 
                    let y = 250 + R + laneOffset;
                    return { x: x * TRACK_SCALE, y: y * TRACK_SCALE, isPocket: true, dir: 'right' };
                }
            }

            let d = ((dist % C) + C) % C; 
            let r = R + laneOffset;
            let x, y;

            if (d < L) { 
                x = rightX - d; 
                y = 250 + r; 
            } else if (d < L + Math.PI * R) { 
                let theta = (d - L) / R;
                x = leftX - r * Math.sin(theta);
                y = 250 + r * Math.cos(theta); 
            } else if (d < 2 * L + Math.PI * R) { 
                x = leftX + (d - (L + Math.PI * R));
                y = 250 - r;
            } else { 
                let theta = (d - (2 * L + Math.PI * R)) / R;
                x = rightX + r * Math.sin(theta); 
                y = 250 - r * Math.cos(theta);
            }
            return { x: x * TRACK_SCALE, y: y * TRACK_SCALE, isPocket: false };
        }

        function getTrackAngle(dist, courseId) {
            let conf = COURSES[courseId];
            let cL = conf.L;
            let cR = conf.R;
            let cC = 2 * cL + 2 * Math.PI * cR;
            
            let pocketInfo = conf.getPocketStart(total_dist);
            if (pocketInfo && dist < pocketInfo.dist) {
                if (pocketInfo.type === 'left-top') return 0; 
                if (pocketInfo.type === 'right-bottom') return Math.PI; 
            }
            
            let d = ((dist % cC) + cC) % cC; 
            
            if (d < cL) { 
                return Math.PI; 
            } else if (d < cL + Math.PI * cR) { 
                let theta = (d - cL) / cR;
                return Math.atan2(-Math.sin(theta), -Math.cos(theta)); 
            } else if (d < 2 * cL + Math.PI * cR) { 
                return 0; 
            } else { 
                let theta = (d - (2 * cL + Math.PI * cR)) / cR;
                return Math.atan2(Math.sin(theta), Math.cos(theta));
            }
        }

        // ==========================================
        // 描画系の処理
        // ==========================================
        function draw(photoStep = -1) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save(); 

            let targetScale = 1.0;
            let targetX = 0;
            let targetY = 0;
            let baseCameraScale = 1.0 / TRACK_SCALE;
            
            let finalStraightLen = L;

            if (photoStep >= 0 && photoStep <= 2) {
                let first = currentRanking[0];
                let second = currentRanking[1];
                let avgLane = first ? first.lane : 8.5;
                let laneDiff = 0;
                if (first && second) {
                    avgLane = (first.lane + second.lane) / 2;
                    laneDiff = Math.abs(first.lane - second.lane);
                }
                
                let maxScale;
                let drawPos;
                let xOffsetRatio = 0.5; 

                if (photoStep === 2) {
                    maxScale = Math.max(5.0, 11.0 - (laneDiff * 0.3)) * baseCameraScale; 
                    drawPos = getTrackPos(start_dist + total_dist, avgLane);
                    xOffsetRatio = 0.5;
                } 
                else if (photoStep === 1) {
                    maxScale = Math.max(3.5, 7.5 - (laneDiff * 0.2)) * baseCameraScale;
                    drawPos = getTrackPos(start_dist + leaderHorse.run_dist, avgLane);
                    xOffsetRatio = 0.55; 
                }
                else if (photoStep === 0) {
                    maxScale = Math.max(2.5, 4.7 - (laneDiff * 0.15)) * baseCameraScale;
                    drawPos = getTrackPos(start_dist + leaderHorse.run_dist, avgLane);
                    xOffsetRatio = 0.6; 
                }

                cameraScale = maxScale; 
                cameraX = canvas.width * xOffsetRatio - (drawPos.x * cameraScale);
                cameraY = canvas.height * 0.5 - (drawPos.y * cameraScale);
            } 
            else if (leaderHorse && isRacing && !isCoolDown) {
                let remainToGoal = total_dist - leaderHorse.run_dist;
                
                if (remainToGoal <= 0) {
                    targetScale = 4.5 * baseCameraScale; 
                    let goalPos = getTrackPos(start_dist + total_dist, 3.5);
                    targetX = canvas.width * 0.75 - (goalPos.x * targetScale);
                    targetY = canvas.height * 0.5 - (goalPos.y * targetScale);
                } else if (cameraMode === 'closeup') {
                    targetScale = (currentCourseId === 'sonoda' ? 8.5 : 7.0) * baseCameraScale;
                    let targetHorse = leaderHorse;
                    
                    if (favoriteHorse && Math.abs(leaderHorse.run_dist - favoriteHorse.run_dist) < 25) {
                        targetHorse = favoriteHorse; 
                    }
                    
                    let pos = getTrackPos(start_dist + targetHorse.run_dist, targetHorse.lane);
                    let angle = getTrackAngle(start_dist + targetHorse.run_dist, currentCourseId);
                    
                    let forwardOffset = 6;
                    let cx = pos.x + Math.cos(angle) * (forwardOffset * TRACK_SCALE);
                    let cy = pos.y + Math.sin(angle) * (forwardOffset * TRACK_SCALE);

                    targetX = canvas.width * 0.5 - (cx * targetScale);
                    targetY = canvas.height * 0.5 - (cy * targetScale);
                } else if (remainToGoal < finalStraightLen + 50) { 
                    let top3 = currentRanking.slice(0, 3);
                    if (top3.length === 0) top3 = [leaderHorse];
                    
                    let minDist = top3[0].run_dist;
                    let maxDist = top3[top3.length - 1].run_dist;
                    let top3Length = Math.max(30, minDist - maxDist); 

                    let top3SpreadY = 10;
                    if (top3.length > 1) {
                         let minL = 99, maxL = -1;
                         top3.forEach(h => { if(h.lane<minL) minL=h.lane; if(h.lane>maxL) maxL=h.lane; });
                         top3SpreadY = Math.max(10, (maxL - minL) * LANE_WIDTH * TRACK_SCALE);
                    }

                    let calculatedScaleByDist = (canvas.width * 0.85) / Math.max(top3Length * TRACK_SCALE, 50);
                    let calculatedScaleByLane = (canvas.height * 0.85) / Math.max(top3SpreadY, 100);
                    let calculatedScale = Math.min(calculatedScaleByDist, calculatedScaleByLane);
                    
                    let maxZoom = currentCourseId === 'sonoda' ? 5.5 : 4.5; 
                    let minZoom = currentCourseId === 'sonoda' ? 2.0 : 2.4;
                    targetScale = Math.min(maxZoom * baseCameraScale, Math.max(minZoom * baseCameraScale, calculatedScale)); 

                    let avgX = 0;
                    let avgY = 0;
                    top3.forEach(h => {
                        let pos = getTrackPos(start_dist + h.run_dist, h.lane);
                        avgX += pos.x;
                        avgY += pos.y;
                    });
                    avgX /= top3.length;
                    avgY /= top3.length;

                    targetX = canvas.width * 0.6 - (avgX * targetScale);
                    targetY = canvas.height * 0.5 - (avgY * targetScale);
                } else {
                    let focusCount = currentCourseId === 'sonoda' ? 5 : 4;
                    let topFocus = currentRanking.slice(0, focusCount);
                    if (topFocus.length === 0) topFocus = [leaderHorse];
                    let fieldLength = Math.max(20, topFocus[0].run_dist - topFocus[topFocus.length - 1].run_dist);
                    
                    if (currentCourseId === 'sonoda') {
                        targetScale = Math.max(2.6, 4.0 - (fieldLength * 0.015)) * baseCameraScale; 
                    } else {
                        targetScale = Math.max(2.4, 4.0 - (fieldLength * 0.012)) * baseCameraScale;
                    }
                    
                    let avgX = 0, avgY = 0;
                    for (let i = 0; i < topFocus.length; i++) {
                        let pos = getTrackPos(start_dist + topFocus[i].run_dist, topFocus[i].lane);
                        avgX += pos.x;
                        avgY += pos.y;
                    }
                    avgX /= topFocus.length;
                    avgY /= topFocus.length;

                    targetX = canvas.width * 0.55 - (avgX * targetScale);
                    targetY = canvas.height * 0.5 - (avgY * targetScale);
                }
                
                let smooth = (remainToGoal >= finalStraightLen + 50) ? 0.08 : 0.06;
                cameraScale += (targetScale - cameraScale) * smooth;
                cameraX += (targetX - cameraX) * smooth;
                cameraY += (targetY - cameraY) * smooth;
            } 
            else if ((!isRacing || isWaitingStart) && horses.length > 0 && horses[0].run_dist < 10 && photoStep === -1 && !isCoolDown) {
                let currentLane = 8.5;
                let forwardOffset = 0;
                
                if (isWaitingStart) {
                    let progress = Math.min(1.0, waitingTicks / 160); 
                    let easeProgress = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
                    currentLane = 0 + (17.0 * easeProgress);
                    
                    targetScale = (currentCourseId === 'basic' ? 9.0 : 18.0) * baseCameraScale; 
                    forwardOffset = 8; 
                } else {
                    targetScale = (currentCourseId === 'basic' ? 2.6 : 2.0) * baseCameraScale;
                    forwardOffset = 0;
                }
                
                let startPos = getTrackPos(start_dist, currentLane);
                let angle = getTrackAngle(start_dist, currentCourseId);
                
                let cx = startPos.x + Math.cos(angle) * (forwardOffset * TRACK_SCALE);
                let cy = startPos.y + Math.sin(angle) * (forwardOffset * TRACK_SCALE);

                targetX = canvas.width * 0.5 - (cx * targetScale);
                targetY = canvas.height * 0.5 - (cy * targetScale);
                
                if (isWaitingStart) {
                    if (waitingTicks <= 2) {
                        cameraScale = targetScale;
                        cameraX = targetX;
                        cameraY = targetY;
                    } else {
                        cameraScale += (targetScale - cameraScale) * 0.2;
                        cameraX = targetX;
                        cameraY = targetY;
                    }
                } else {
                    cameraScale += (targetScale - cameraScale) * 0.1;
                    cameraX += (targetX - cameraX) * 0.1;
                    cameraY += (targetY - cameraY) * 0.1;
                }
            }
            else {
                if (isCoolDown && photoStep === -1) {
                    targetScale = (currentCourseId === 'sonoda' ? 2.2 : 1.3) * baseCameraScale; 
                    targetX = canvas.width * 0.5 - (500 * TRACK_SCALE) * targetScale;
                    if (currentCourseId === 'basic') {
                        targetX += 60 * TRACK_SCALE * targetScale; 
                    }
                    targetY = canvas.height * 0.5 - (250 * TRACK_SCALE) * targetScale;

                    cameraScale += (targetScale - cameraScale) * 0.05;
                    cameraX += (targetX - cameraX) * 0.05;
                    cameraY += (targetY - cameraY) * 0.05;
                }
            }

            ctx.translate(cameraX, cameraY);
            ctx.scale(cameraScale, cameraScale);

            // --- コースの描画 ---
            let outerR = R + 10;
            let innerR = R - 9.5 * LANE_WIDTH; 
            let outmostR = R + 13.5 * LANE_WIDTH;
            
            ctx.strokeStyle = currentSurface === 'dirt' ? '#b45309' : '#4ade80'; 
            ctx.lineWidth = (outmostR - innerR) * TRACK_SCALE; 
            ctx.lineCap = 'butt';
            ctx.beginPath();
            ctx.arc(leftX*TRACK_SCALE, 250*TRACK_SCALE, (R)*TRACK_SCALE, Math.PI/2, Math.PI*1.5); 
            ctx.lineTo(rightX*TRACK_SCALE, (250 - R)*TRACK_SCALE); 
            ctx.arc(rightX*TRACK_SCALE, 250*TRACK_SCALE, (R)*TRACK_SCALE, -Math.PI/2, Math.PI/2);
            ctx.lineTo(leftX*TRACK_SCALE, (250 + R)*TRACK_SCALE); 
            ctx.stroke();

            let pocketInfo = COURSES[currentCourseId].getPocketStart(total_dist);

            if (pocketInfo) {
                let pLength = Math.abs(start_dist - pocketInfo.dist) + 50; 
                if (pocketInfo.type === 'left-top') {
                    let startX = leftX - pLength;
                    ctx.strokeStyle = currentSurface === 'dirt' ? '#b45309' : '#4ade80'; 
                    ctx.lineWidth = (outmostR - innerR) * TRACK_SCALE; 
                    ctx.beginPath();
                    ctx.moveTo(startX * TRACK_SCALE, (250 - R) * TRACK_SCALE); 
                    ctx.lineTo(leftX * TRACK_SCALE, (250 - R) * TRACK_SCALE);
                    ctx.stroke();
                    
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2 * TRACK_SCALE;
                    ctx.beginPath();
                    ctx.moveTo(startX * TRACK_SCALE, (250 - innerR) * TRACK_SCALE);
                    ctx.lineTo(leftX * TRACK_SCALE, (250 - innerR) * TRACK_SCALE);
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.moveTo(startX * TRACK_SCALE, (250 - outmostR) * TRACK_SCALE);
                    ctx.lineTo(leftX * TRACK_SCALE, (250 - outmostR) * TRACK_SCALE);
                    ctx.stroke();
                } else if (pocketInfo.type === 'right-bottom') {
                    let startX = rightX + pLength;
                    ctx.strokeStyle = currentSurface === 'dirt' ? '#b45309' : '#4ade80'; 
                    ctx.lineWidth = (outmostR - innerR) * TRACK_SCALE; 
                    ctx.beginPath();
                    ctx.moveTo(startX * TRACK_SCALE, (250 + R) * TRACK_SCALE); 
                    ctx.lineTo(rightX * TRACK_SCALE, (250 + R) * TRACK_SCALE);
                    ctx.stroke();
                    
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2 * TRACK_SCALE;
                    ctx.beginPath();
                    ctx.moveTo(startX * TRACK_SCALE, (250 + innerR) * TRACK_SCALE);
                    ctx.lineTo(rightX * TRACK_SCALE, (250 + innerR) * TRACK_SCALE);
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.moveTo(startX * TRACK_SCALE, (250 + outmostR) * TRACK_SCALE);
                    ctx.lineTo(rightX * TRACK_SCALE, (250 + outmostR) * TRACK_SCALE);
                    ctx.stroke();
                }
            }

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2 * TRACK_SCALE;
            
            ctx.beginPath();
            ctx.arc(leftX*TRACK_SCALE, 250*TRACK_SCALE, innerR*TRACK_SCALE, Math.PI/2, Math.PI*1.5); 
            ctx.lineTo(rightX*TRACK_SCALE, (250 - innerR)*TRACK_SCALE); 
            ctx.arc(rightX*TRACK_SCALE, 250*TRACK_SCALE, innerR*TRACK_SCALE, -Math.PI/2, Math.PI/2);
            ctx.lineTo(leftX*TRACK_SCALE, (250 + innerR)*TRACK_SCALE);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(leftX*TRACK_SCALE, 250*TRACK_SCALE, outmostR*TRACK_SCALE, Math.PI/2, Math.PI*1.5); 
            ctx.lineTo(rightX*TRACK_SCALE, (250 - outmostR)*TRACK_SCALE); 
            ctx.arc(rightX*TRACK_SCALE, 250*TRACK_SCALE, outmostR*TRACK_SCALE, -Math.PI/2, Math.PI/2);
            ctx.lineTo(leftX*TRACK_SCALE, (250 + outmostR)*TRACK_SCALE); 
            ctx.stroke();

            // ゴールラインの描画
            let gPos1 = getTrackPos(goal_dist, -1.5);
            let gPos2 = getTrackPos(goal_dist, 18.5);
            ctx.strokeStyle = (photoStep === 2) ? '#ff0000' : 'rgba(239, 68, 68, 0.6)';
            ctx.lineWidth = (photoStep === 2) ? 1.0 * TRACK_SCALE : 3 * TRACK_SCALE;
            ctx.beginPath();
            ctx.moveTo(gPos1.x, gPos1.y);
            ctx.lineTo(gPos2.x, gPos2.y);
            ctx.stroke();
            if (photoStep === 2) {
                 ctx.strokeStyle = '#ffffff';
                 ctx.lineWidth = 0.6 * TRACK_SCALE;
                 ctx.stroke();
            }

            // ゲート描画
            if (gateOffset < 300) {
                let pC = getTrackPos(start_dist, 8.5);
                let angle = getTrackAngle(start_dist, currentCourseId);

                let cx = pC.x + Math.cos(angle - Math.PI/2) * gateOffset * TRACK_SCALE;
                let cy = pC.y + Math.sin(angle - Math.PI/2) * gateOffset * TRACK_SCALE;

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);

                let gateW = 18 * LANE_WIDTH * TRACK_SCALE; 
                let halfW = gateW / 2;
                
                ctx.fillStyle = '#334155'; 
                ctx.fillRect(-10 * TRACK_SCALE, -halfW, 20 * TRACK_SCALE, gateW);
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 1.5 * TRACK_SCALE;
                ctx.strokeRect(-10 * TRACK_SCALE, -halfW, 20 * TRACK_SCALE, gateW);

                ctx.strokeStyle = '#cbd5e1';
                ctx.lineWidth = 0.5 * TRACK_SCALE;
                for (let i = 0; i <= 18; i++) {
                    let yy = -halfW + (i / 18) * gateW;
                    ctx.beginPath();
                    ctx.moveTo(-10 * TRACK_SCALE, yy);
                    ctx.lineTo(10 * TRACK_SCALE, yy);
                    ctx.stroke();
                }
                
                if (isWaitingStart || (!isRacing && frameCount < 10)) {
                    ctx.strokeStyle = '#eab308';
                    ctx.lineWidth = 2 * TRACK_SCALE;
                    ctx.beginPath();
                    ctx.moveTo(10 * TRACK_SCALE, -halfW);
                    ctx.lineTo(10 * TRACK_SCALE, halfW);
                    ctx.stroke();
                }

                ctx.restore();
            }

            // --- 内馬場の巨大スクリーン ---
            if (!isRacing || (isCoolDown && photoStep === -1)) {
                ctx.save();
                ctx.translate(500 * TRACK_SCALE, 250 * TRACK_SCALE);
                
                let screenScale = currentCourseId === 'sonoda' ? 1.0 : 2.5; 
                ctx.scale(screenScale, screenScale);

                const boardW = 200;
                const boardH = 220;
                const rankBx = -boardW - 15;
                const oddsBx = 15;
                const by = -120;

                ctx.fillStyle = '#374151';
                ctx.fillRect(rankBx + 40, by + boardH, 10, 20);
                ctx.fillRect(rankBx + boardW - 50, by + boardH, 10, 20);
                ctx.fillRect(oddsBx + 40, by + boardH, 10, 20);
                ctx.fillRect(oddsBx + boardW - 50, by + boardH, 10, 20);

                ctx.fillStyle = '#111827'; 
                ctx.fillRect(rankBx, by, boardW, boardH);
                ctx.strokeStyle = '#4b5563';
                ctx.lineWidth = 4;
                ctx.strokeRect(rankBx, by, boardW, boardH);
                
                ctx.fillStyle = '#10b981'; 
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                
                let rankBoardTitle = '▶ RACE RESULT ◀';
                ctx.fillText(rankBoardTitle, rankBx + boardW / 2, by + 12);
                
                ctx.beginPath();
                ctx.moveTo(rankBx + 10, by + 35);
                ctx.lineTo(rankBx + boardW - 10, by + 35);
                ctx.strokeStyle = '#374151';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.textAlign = 'left';
                ctx.font = 'bold 15px sans-serif';
                ctx.textBaseline = 'middle';
                
                let displayRanking = finishedHorses.length > 0 ? finishedHorses : [...currentHorses].sort((a, b) => a.odds - b.odds);
                
                for (let i = 0; i < 5; i++) {
                    let h = displayRanking[i];
                    if (h) {
                        let y = by + 60 + i * 32;
                        ctx.fillStyle = h.isGoal ? '#ef4444' : '#fbbf24'; 
                        ctx.fillText(`${i+1}`, rankBx + 20, y);
                        
                        let nameColor = h.wakuBg === '#1f2937' ? '#9ca3af' : h.wakuBg;
                        ctx.fillStyle = nameColor;
                        let numText = String(h.horseNum).padStart(2, ' ');
                        let nameText = h.name.length > 6 ? h.name.substring(0, 6) + '..' : h.name;
                        ctx.fillText(`[${numText}] ${nameText}`, rankBx + 45, y);
                    }
                }

                ctx.fillStyle = '#111827'; 
                ctx.fillRect(oddsBx, by, boardW, boardH);
                ctx.strokeStyle = '#4b5563';
                ctx.lineWidth = 4;
                ctx.strokeRect(oddsBx, by, boardW, boardH);
                
                ctx.fillStyle = '#3b82f6'; 
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText('▶ ODDS INFO ◀', oddsBx + boardW / 2, by + 12);
                
                ctx.beginPath();
                ctx.moveTo(oddsBx + 10, by + 35);
                ctx.lineTo(oddsBx + boardW - 10, by + 35);
                ctx.stroke();

                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                
                let oddsMode1 = '【確定 単勝】';
                let oddsMode2 = '【確定 三連単】';
                let dispHorses = [];
                let dispTrifecta = [];
                let titleColor = '#fcd34d'; 

                if (finishedHorses.length > 0) {
                    dispHorses = finishedHorses.slice(0, 3);
                    if (dispHorses.length >= 3) {
                        let h1 = dispHorses[0]; let h2 = dispHorses[1]; let h3 = dispHorses[2];
                        let P1 = h1.currentWinRate; let P2 = h2.currentWinRate / (1 - P1); let P3 = h3.currentWinRate / (1 - P1 - h2.currentWinRate);
                        let o = 0.725 / (P1 * P2 * P3);
                        dispTrifecta.push({n1: h1.horseNum, n2: h2.horseNum, n3: h3.horseNum, odds: Math.max(1.1, Math.floor(o*10)/10)});
                    }
                } else {
                    let sortedByOdds = [...currentHorses].sort((a, b) => a.odds - b.odds);
                    dispHorses = sortedByOdds.slice(0, 3);
                    dispTrifecta = trifectaOddsList.map(t => ({n1: t.name1, n2: t.name2, n3: t.name3, odds: t.odds}));
                }

                ctx.font = '12px sans-serif';
                ctx.fillStyle = titleColor;
                ctx.fillText(oddsMode1, oddsBx + 15, by + 45);
                ctx.font = 'bold 13px sans-serif';
                for(let i=0; i<dispHorses.length; i++) {
                    let h = dispHorses[i];
                    if (!h) continue;
                    let nameColor = h.wakuBg === '#1f2937' ? '#9ca3af' : h.wakuBg;
                    ctx.fillStyle = nameColor;
                    let nameText = h.name.length > 4 ? h.name.substring(0, 4) + '..' : h.name;
                    ctx.fillText(`[${String(h.horseNum).padStart(2, ' ')}] ${nameText}`, oddsBx + 15, by + 65 + i * 18);
                    ctx.textAlign = 'right';
                    ctx.fillStyle = '#e5e7eb';
                    ctx.fillText(`${h.odds.toFixed(1)}倍`, oddsBx + boardW - 15, by + 65 + i * 18);
                    ctx.textAlign = 'left';
                }

                ctx.font = '12px sans-serif';
                ctx.fillStyle = titleColor;
                ctx.fillText(oddsMode2, oddsBx + 15, by + 125);
                
                if (finishedHorses.length === 0) {
                    ctx.font = 'bold 13px sans-serif';
                    ctx.fillStyle = '#e5e7eb';
                    for(let i=0; i<dispTrifecta.length; i++) {
                        let tri = dispTrifecta[i];
                        ctx.fillText(`${tri.n1} - ${tri.n2} - ${tri.n3}`, oddsBx + 15, by + 145 + i * 18);
                        ctx.textAlign = 'right';
                        ctx.fillText(`${tri.odds.toFixed(1)}倍`, oddsBx + boardW - 15, by + 145 + i * 18);
                        ctx.textAlign = 'left';
                    }
                } else {
                    if (dispTrifecta.length > 0) {
                        let tri = dispTrifecta[0];
                        ctx.font = 'bold 18px sans-serif';
                        ctx.fillStyle = titleColor;
                        ctx.textAlign = 'center';
                        ctx.fillText(`${tri.n1} → ${tri.n2} → ${tri.n3}`, oddsBx + boardW / 2, by + 150);
                        
                        ctx.font = 'bold 24px sans-serif';
                        ctx.fillStyle = '#fbbf24'; 
                        ctx.fillText(`${tri.odds.toFixed(1)}倍`, oddsBx + boardW / 2, by + 180);
                        ctx.textAlign = 'left';
                    }
                }
                
                ctx.restore();
            }

            let sortedHorses = [...horses].sort((a, b) => a.run_dist - b.run_dist);
            
            sortedHorses.forEach(horse => {
                let pos = getTrackPos(start_dist + horse.run_dist, horse.lane);
                
                ctx.save();
                ctx.translate(pos.x, pos.y);
                
                let bounce = 0;
                let legAnim = 0;
                if (isWaitingStart) {
                    bounce = Math.sin(Date.now() / 80 + horse.horseNum * 10) * 0.8;
                } else if (isRacing && !horse.isGoal && !horse.isSweating && horse.startDelay <= 0) {
                     bounce = Math.sin(Date.now() / 40 + horse.horseNum * 10) * 1.5; 
                     legAnim = Math.sin(Date.now() / 60 + horse.horseNum * 10); 
                }
                ctx.translate(0, bounce);
                
                let angle = getTrackAngle(start_dist + horse.run_dist, currentCourseId);
                ctx.rotate(angle);

                ctx.scale(1.2, 1.2);

                let coat = coatColors[horse.coat] || coatColors['bay'];

                // 影の描画
                ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
                ctx.beginPath();
                ctx.ellipse(0, 5 - bounce, 11, 4, 0, 0, Math.PI * 2);
                ctx.fill();

                let headStretch = 0;
                let armPush = 0;
                if (isRacing && !horse.isGoal && horse.startDelay <= 0) {
                     headStretch = Math.sin(Date.now() / 40 + horse.horseNum * 10) * 1.5;
                     armPush = Math.sin(Date.now() / 40 + horse.horseNum * 10) * 1.0;
                }
                let headX = 9 + headStretch;

                let tailSway = 0;
                if (isRacing && !horse.isGoal) {
                    tailSway = Math.sin(Date.now() / 30 + horse.horseNum * 10) * 2;
                }

                if (horse.skillTimer > 0 && isRacing && !horse.isGoal) {
                    let hue = (Date.now() / 3 + horse.horseNum * 30) % 360;
                    ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
                    ctx.shadowBlur = 15;
                    ctx.fillStyle = `hsla(${hue}, 100%, 60%, 0.5)`;
                    ctx.beginPath();
                    ctx.ellipse(2, 0, 14, 7, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                // --- 脚 ---
                ctx.strokeStyle = coat.mane; 
                ctx.lineWidth = 2.0;
                ctx.lineCap = 'round';
                
                ctx.beginPath(); ctx.moveTo(5, -2); ctx.lineTo(5 + legAnim * 4, -5); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(5, 2); ctx.lineTo(5 - legAnim * 4, 5); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-5, -2.5); ctx.lineTo(-5 - legAnim * 4, -5.5); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-5, 2.5); ctx.lineTo(-5 + legAnim * 4, 5.5); ctx.stroke();

                // --- 馬の体 ---
                ctx.fillStyle = coat.body;
                ctx.beginPath();
                ctx.arc(-6, 0, 4.0, Math.PI/2, -Math.PI/2);
                ctx.bezierCurveTo(-2, -3.5, 4, -3.5, 6, -2.5);
                ctx.lineTo(headX, -1.5);
                ctx.lineTo(headX+2, -1.0);
                ctx.lineTo(headX+2, 1.0);
                ctx.lineTo(headX, 1.5);
                ctx.lineTo(6, 2.5);
                ctx.bezierCurveTo(4, 3.5, -2, 3.5, -6, 4.0);
                ctx.fill();

                ctx.fillStyle = coat.body;
                ctx.beginPath(); ctx.arc(headX-0.5, -1.5, 1, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(headX-0.5, 1.5, 1, 0, Math.PI*2); ctx.fill();

                ctx.fillStyle = '#111'; // 目
                ctx.beginPath(); ctx.arc(headX - 0.5, -0.6, 0.4, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(headX - 0.5, 0.6, 0.4, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'rgba(0,0,0,0.4)'; // 鼻先
                ctx.beginPath(); ctx.arc(headX + 1.5, 0, 0.6, 0, Math.PI*2); ctx.fill();

                ctx.strokeStyle = coat.mane;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(3, 0);
                ctx.lineTo(headX-1, 0);
                ctx.stroke();

                ctx.fillStyle = coat.mane;
                ctx.beginPath();
                ctx.moveTo(-9, 0);
                ctx.bezierCurveTo(-12, tailSway, -15, tailSway*1.5, -16 + Math.abs(legAnim), tailSway);
                ctx.bezierCurveTo(-13, tailSway*0.5, -10, 1, -9, 0);
                ctx.fill();

                // --- 騎手 (ジョッキー) ---
                let isWhipping = isRacing && !horse.isGoal && (horse.isBattling || horse.currentStamina < 15);
                
                ctx.fillStyle = horse.wakuBg;
                ctx.beginPath();
                ctx.ellipse(-1 + armPush*0.3, 0, 3.5, 2.5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.lineWidth = 0.5;
                ctx.stroke();
                
                ctx.strokeStyle = horse.wakuBg;
                ctx.lineWidth = 2.0;
                ctx.lineCap = 'round';
                
                ctx.beginPath(); ctx.moveTo(-1 + armPush*0.3, -2); ctx.lineTo(2 + armPush, -3); ctx.stroke();
                
                if (isWhipping) {
                    let whipAnim = Math.sin(Date.now() / 20 + horse.horseNum * 10);
                    ctx.beginPath(); ctx.moveTo(-1 + armPush*0.3, 2); ctx.lineTo(-1 + whipAnim*2, 4); ctx.stroke();
                    ctx.strokeStyle = '#e5e7eb';
                    ctx.lineWidth = 0.8;
                    ctx.beginPath(); ctx.moveTo(-1 + whipAnim*2, 4); ctx.lineTo(-4 + whipAnim*4, 7); ctx.stroke();
                } else {
                    ctx.beginPath(); ctx.moveTo(-1 + armPush*0.3, 2); ctx.lineTo(2 + armPush, 3); ctx.stroke();
                }

                ctx.fillStyle = horse.wakuBg;
                ctx.beginPath(); ctx.arc(1 + armPush*0.8, 0, 2.2, 0, Math.PI * 2); ctx.fill();
                
                ctx.fillStyle = '#f1f5f9'; 
                ctx.beginPath(); ctx.fillRect(1.5 + armPush*0.8, -1.2, 1.2, 2.4); ctx.fill();
                ctx.fillStyle = '#1e293b'; 
                ctx.beginPath(); ctx.fillRect(2.0 + armPush*0.8, -1.0, 0.8, 2.0); ctx.fill();

                ctx.shadowBlur = 0;
                ctx.restore();

                let markerY = pos.y - 15 + bounce;

                ctx.beginPath();
                ctx.arc(pos.x, markerY, 6, 0, Math.PI * 2);
                ctx.fillStyle = horse.wakuBg;
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 1;
                ctx.stroke();
                
                ctx.fillStyle = horse.wakuText;
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(horse.horseNum, pos.x, markerY);

                if (horse.isSweating && isRacing) {
                    let sweatCount = Math.min(3, Math.floor((horse.exhaustion || 0) / 30) + 1); 
                    ctx.font = '10px sans-serif';
                    ctx.fillText('💦'.repeat(sweatCount), pos.x + 8, markerY - 4);
                } else if (horse.isBattling && isRacing) {
                    ctx.font = '10px sans-serif';
                    ctx.fillText('🔥', pos.x + 8, markerY - 4);
                } 
                
                if (horse.isSandCovered && isRacing) {
                    ctx.font = '12px sans-serif';
                    ctx.fillText('☁️', pos.x - 16, pos.y + bounce);
                } else if (horse.isDrafting && isRacing) {
                    ctx.font = '12px sans-serif';
                    ctx.fillText('💨', pos.x - 16, pos.y + bounce);
                } else if (horse.isStressed && isRacing) {
                    ctx.font = '10px sans-serif';
                    ctx.fillText('💢', pos.x + 8, markerY - 4);
                }
            });

            ctx.restore(); 

            if (cameraScale > 1.05) {
                cinemaBarHeight += (40 - cinemaBarHeight) * 0.1;
            } else {
                cinemaBarHeight += (0 - cinemaBarHeight) * 0.1;
            }
            if (cinemaBarHeight > 0.5) {
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, canvas.width, cinemaBarHeight);
                ctx.fillRect(0, canvas.height - cinemaBarHeight, canvas.width, cinemaBarHeight);
            }

            if (skillCutinEnabled && activeSkillCutins.length > 0) {
                activeSkillCutins.forEach((cutin, idx) => {
                    let progress = cutin.time / cutin.maxTime; 
                    let alpha = Math.min(1.0, cutin.time / 15.0); 
                    
                    let yOffset = 180 + (idx * 65); 
                    
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    
                    let slideX = 0;
                    if (progress > 0.8) {
                        slideX = canvas.width * (progress - 0.8) * 5; 
                    } else if (progress < 0.2) {
                        slideX = -canvas.width * (0.2 - progress) * 5; 
                    }
                    
                    let typeColors = {
                        'nige': 'rgba(220, 38, 38, 0.85)',    
                        'senko': 'rgba(234, 88, 12, 0.85)',   
                        'sashi': 'rgba(37, 99, 235, 0.85)',   
                        'oikomi': 'rgba(147, 51, 234, 0.85)'  
                    };
                    let baseColor = typeColors[cutin.horse.type] || 'rgba(0,0,0,0.8)';

                    let gradient = ctx.createLinearGradient(0, yOffset, canvas.width, yOffset);
                    gradient.addColorStop(0, 'rgba(0,0,0,0)');
                    gradient.addColorStop(0.2, baseColor);
                    gradient.addColorStop(0.8, baseColor);
                    gradient.addColorStop(1, 'rgba(0,0,0,0)');
                    
                    ctx.fillStyle = gradient;
                    ctx.fillRect(slideX, yOffset, canvas.width, 50);

                    ctx.fillStyle = '#ffffff';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = 'rgba(0,0,0,0.9)';
                    ctx.shadowBlur = 4;
                    ctx.shadowOffsetX = 2;
                    ctx.shadowOffsetY = 2;

                    ctx.font = 'italic bold 22px sans-serif';
                    ctx.fillText(`⚡ ${cutin.horse.skillName} ⚡`, canvas.width/2 + slideX, yOffset + 15);
                    ctx.font = 'bold 16px sans-serif';
                    ctx.fillStyle = '#fde047';
                    ctx.fillText(`${cutin.horse.name}`, canvas.width/2 + slideX, yOffset + 38);
                    
                    ctx.restore();
                    
                    cutin.time -= 1;
                });
                activeSkillCutins = activeSkillCutins.filter(c => c.time > 0);
            }

            if (isRacing && leaderHorse) {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(10, 10, 240, 140); 
                
                ctx.textAlign = 'left';
                const remain = Math.max(0, Math.floor(total_dist - leaderHorse.run_dist));
                let surfaceText = currentSurface === 'turf' ? '芝' : 'ダート';
                
                let paceText = 'ミドル';
                let paceColor = '#fbbf24'; 
                if (currentPace === 'high') { paceText = 'ハイ'; paceColor = '#ef4444'; }
                else if (currentPace === 'slow') { paceText = 'スロー'; paceColor = '#60a5fa'; }
                else if (currentPace === 'dainige') { paceText = '大逃げ'; paceColor = '#d946ef'; }
                
                ctx.font = '14px sans-serif';
                ctx.fillStyle = 'white';
                ctx.fillText(`${surfaceText} ${total_dist}m  残り: ${remain}m`, 20, 30);
                
                ctx.font = 'bold 14px sans-serif';
                ctx.fillStyle = paceColor;
                ctx.fillText(paceText, 185, 30);

                let h1 = currentRanking[0];
                let h2 = currentRanking[1];
                let h3 = currentRanking[2];
                
                ctx.font = 'bold 16px sans-serif';
                if (h1) {
                    ctx.fillStyle = h1.wakuBg === '#1f2937' ? '#9ca3af' : h1.wakuBg;
                    ctx.fillText(`1番手: ${h1.horseNum}.${h1.name}`, 20, 60);
                }
                
                ctx.font = '15px sans-serif';
                if (h2) {
                    ctx.fillStyle = h2.wakuBg === '#1f2937' ? '#9ca3af' : h2.wakuBg;
                    ctx.fillText(`2番手: ${h2.horseNum}.${h2.name}`, 20, 80);
                }
                if (h3) {
                    ctx.fillStyle = h3.wakuBg === '#1f2937' ? '#9ca3af' : h3.wakuBg;
                    ctx.fillText(`3番手: ${h3.horseNum}.${h3.name}`, 20, 100);
                }

                if (favoriteHorse) {
                    let favRank = currentRanking.indexOf(favoriteHorse) + 1;
                    ctx.fillStyle = '#fcd34d'; 
                    ctx.font = 'bold 14px sans-serif';
                    ctx.fillText(`1番人気(${favoriteHorse.horseNum}.${favoriteHorse.name}) : ${favRank}番手`, 20, 130);
                }
            }
        }

        // ==========================================
        // 馬の物理演算ロジック (グラデーション失速調整版)
        // ==========================================
        function moveHorse(horse, allHorses, currentLeader, cPace, speedMultiplier, isSim = false) {
            if (horse.startDelay > 0) {
                horse.startDelay -= 1 * speedMultiplier;
                if (horse.startDelay > 0) return; 
            }

            let remainToGoal = total_dist - horse.run_dist; 
            let currentSpeed = horse.actualSpeedBase; 
            
            // 道中全体のスタミナ消費倍率の基本を1.0に設定
            let staminaCost = 1.0; 
            
            horse.isDrafting = false;
            horse.isSandCovered = false;
            horse.isStressed = false;
            horse.blocked = false;
            horse.isBattling = false; 

            let fieldSpread = Math.max(1.0, total_dist / 2000); 
            if (cPace === 'high') {
                fieldSpread *= 2.2; 
            } else if (cPace === 'slow') {
                fieldSpread *= 0.6; 
            } else if (cPace === 'dainige') {
                fieldSpread *= 3.5; 
            }

            if (currentCourseId === 'basic') {
                fieldSpread *= 0.45; 
            }

            let spurtDist = currentCourseId === 'sonoda' ? Math.min(800, total_dist * 0.55) : Math.min(800, total_dist * 0.35);

            if (horse.isChokusenIkki) {
                spurtDist = currentCourseId === 'sonoda' ? 250 : 550; 
            }

            let makuriStartLimit = currentCourseId === 'sonoda' ? 0.75 : 0.45;
            if (horse.isMakuri && !horse.isChokusenIkki && remainToGoal <= total_dist * makuriStartLimit && remainToGoal > spurtDist + 50) {
                horse.makuriTriggered = true;
            }

            if (remainToGoal < spurtDist + 400 && remainToGoal >= 0) {
                 let compressRatio = Math.max(0, Math.min(1, (remainToGoal - 300) / (spurtDist + 100)));
                 fieldSpread = 0.35 + (fieldSpread - 0.35) * compressRatio;
            }

            let distToLeader = currentLeader.run_dist - horse.run_dist;
            let targetDistMin = 0, targetDistMax = 0;

            let dist = start_dist + horse.run_dist;
            let isCorner = false;
            let actualR = R;

            let pocketInfo = COURSES[currentCourseId].getPocketStart(total_dist);
            if (pocketInfo && dist < pocketInfo.dist) {
                isCorner = false;
            } else {
                let d = ((dist % C) + C) % C;
                isCorner = (d >= L && d < L + Math.PI * R) || (d >= 2 * L + Math.PI * R);
                actualR = R + (horse.lane - 8.5) * LANE_WIDTH; 
            }

            if (!horse.skillUsed && horse.currentStamina > 0 && !horse.blocked && finishedHorses.length === 0) {
                let triggerDist = (horse.type === 'nige' || horse.type === 'senko') ? 750 : 450;
                if (remainToGoal < triggerDist && remainToGoal > triggerDist - 250) {
                    if (Math.random() < 0.006 * speedMultiplier) { 
                        horse.skillUsed = true;
                        horse.skillTimer = 180; 
                        if (!isSim && skillCutinEnabled && activeSkillCutins.length < 3) {
                            activeSkillCutins.push({
                                horse: horse,
                                time: 90, 
                                maxTime: 90
                            });
                        }
                    }
                }
            }

            if (horse.skillTimer > 0) {
                horse.skillTimer -= 1;
                currentSpeed *= 1.05; 
                staminaCost *= 0.5;   
                horse.isBattling = true; 
            }
            
            // ペースとスタミナを読み合わせるまくり発動判断AI（無理なまくりを抑制）
            if (horse.isMakuri && !horse.makuriTriggered && horse.currentStamina > 0 && !horse.blocked && finishedHorses.length === 0) {
                let triggerDist = currentCourseId === 'sonoda' ? 800 : 1000;
                if (remainToGoal < triggerDist && remainToGoal > spurtDist + 100) {
                    let staminaRatio = horse.currentStamina / horse.maxStamina;
                    let executeProb = 0.01 * speedMultiplier;
                    let shouldMakuri = false;
                    
                    if (cPace === 'high') {
                        // ハイペース時は無理なまくりを大きく制限
                        if (staminaRatio > 0.85) { executeProb *= 0.1; shouldMakuri = true; }
                    } else if (cPace === 'slow') {
                        if (staminaRatio > 0.40) { executeProb *= 3.0; shouldMakuri = true; }
                    } else {
                        if (staminaRatio > 0.65) {
                            executeProb *= (cPace === 'dainige' ? 1.2 : 0.8);
                            shouldMakuri = true;
                        }
                    }

                    if (shouldMakuri && Math.random() < executeProb) {
                        horse.makuriTriggered = true;
                        if (!isSim && !makuriAnnounced) {
                            commentary.innerText = `おっと！ここで ${horse.name} が外から動いていった！`;
                            lastCommentaryTime = Date.now();
                            makuriAnnounced = true;
                        }
                    }
                }
            }

            let personalDistOffset = ((horse.horseNum * 3.7) % 15) - 7.5; 
            targetDistMax = 20 + personalDistOffset; 

            // 3コーナー（スパート手前250m、園田はコースが小さいため150m）の進入距離を定義
            let threeCornerDist = spurtDist + (currentCourseId === 'sonoda' ? 150 : 250);

            // 3コーナーに差し掛かった馬は、先頭との距離を詰めるため、目標最大距離（targetDistMax）を徐々に小さくする（ギュッと凝縮する）
            if (remainToGoal > spurtDist && remainToGoal < threeCornerDist) {
                let range = threeCornerDist - spurtDist;
                let ratio = (remainToGoal - spurtDist) / range; // 1.0 (3角手前) -> 0.0 (スパート開始)
                let compression = 0.35 + 0.65 * ratio; // 本来の目標最大距離を最終的に35%まで圧縮
                if (horse.type !== 'nige') {
                    targetDistMax *= compression;
                }
            }

            let paceStaminaMod = 1.0;
            let paceSpeedMod = 1.0;
            if (remainToGoal > spurtDist) {
                if (cPace === 'high') { paceSpeedMod = 1.04; paceStaminaMod = 1.15; } // ハイペース時の余分なスタミナ消費をさらに抑制
                else if (cPace === 'slow') { paceSpeedMod = 0.96; paceStaminaMod = 0.85; }
                else if (cPace === 'dainige') {
                    if (horse === currentLeader) {
                        paceSpeedMod = 1.06; paceStaminaMod = 1.30; 
                    } else {
                        paceSpeedMod = 0.96; paceStaminaMod = 0.85; 
                    }
                }
            }

            if (remainToGoal > spurtDist) { 
                currentSpeed *= paceSpeedMod;
                staminaCost *= paceStaminaMod;

                let isRearPushing = false;
                allHorses.forEach(h => {
                    if (h !== horse && h.makuriTriggered && h.run_dist < horse.run_dist + 5) {
                        isRearPushing = true;
                    }
                });

                if (cPace === 'high') {
                    let posFactor = Math.max(0, 30 - distToLeader) / 30; 
                    staminaCost *= (1.0 + 0.25 * posFactor); // ハイペース時スタミナ負荷軽減
                } else if (cPace === 'slow') {
                    let posFactor = Math.min(30, distToLeader) / 30; 
                    staminaCost *= (1.0 + 0.20 * posFactor); // スローペース時スタミナ負荷軽減
                }

                if (horse.makuriTriggered && cPace === 'high') {
                    staminaCost *= 1.20; // まくりスタミナ負荷軽減
                }

                if (distToLeader > targetDistMax) {
                    let catchUpRate = currentCourseId === 'basic' ? 0.0050 : 0.0030;
                    
                    // 3コーナー進入からスパート位置までの間、追いつき反応（catchUpRate）を1.5倍に強化して、綺麗に距離を詰めさせる
                    if (remainToGoal < threeCornerDist && remainToGoal > spurtDist) {
                        catchUpRate *= 1.5;
                    }

                    let catchUpFactor = 1.0 + (distToLeader - targetDistMax) * catchUpRate;
                    
                    // 捲りの最大速度上限を厳格に「1.10倍」に固定
                    let maxCatchUp = 1.10; 
                    let minCatchUp = 1.02;
                    
                    if (horse.makuriTriggered) {
                        if (horse.makuriProgress === undefined) horse.makuriProgress = 0;
                        
                        let progressRate = currentCourseId === 'sonoda' ? 0.00010 : 0.0010;
                        horse.makuriProgress += progressRate * speedMultiplier;
                        
                        let progress = Math.min(1.0, horse.makuriProgress);
                        
                        let maxBonus = currentCourseId === 'sonoda' ? 0.003 : 0.010; 
                        let catchUpFactorBase = currentCourseId === 'sonoda' ? 0.00004 : 0.00012; 
                        
                        catchUpFactor = 1.0 + (distToLeader - targetDistMax) * catchUpFactorBase * Math.pow(progress, 1.5); 
                        
                        if (distToLeader < 12.0) {
                            let damp = Math.max(0.0, distToLeader / 12.0);
                            catchUpFactor = 1.0 + (catchUpFactor - 1.0) * damp;
                        }
                        
                        catchUpFactor = Math.min(1.10, catchUpFactor); // まくりの最大倍率を1.10倍に制限
                        maxCatchUp = 1.10; 
                        minCatchUp = 1.00 + (0.02 * progress); 
                    }
                    currentSpeed *= Math.min(maxCatchUp, Math.max(minCatchUp, catchUpFactor)); 
                    
                    if (currentCourseId === 'basic') {
                        if (horse.type === 'nige') {
                            staminaCost *= isRearPushing ? 1.15 : 1.02; // スタミナ負荷マイルド化
                        } else if (horse.type === 'senko') {
                            staminaCost *= isRearPushing ? 1.10 : 1.01; 
                        } else {
                            staminaCost *= 0.95; 
                        }
                    } else {
                        if (horse.makuriTriggered) {
                            staminaCost *= 1.15; // 園田のまくり消費抑制
                        } else if (horse.type === 'sashi' || horse.type === 'oikomi') {
                            staminaCost *= 1.01;
                        } else {
                            staminaCost *= isRearPushing ? 1.20 : 1.03; 
                        }
                    }
                } else if (distToLeader < targetDistMin) {
                    let slowDown = (currentCourseId === 'sonoda' && horse.makuriTriggered) ? 0.90 : 0.95;
                    currentSpeed *= slowDown; 
                    staminaCost *= 0.9;
                }
                
                if(horse.type === 'nige') { currentSpeed *= 1.03; }
                else if(horse.type === 'senko') { currentSpeed *= 1.01; }
                else if(horse.type === 'sashi') { currentSpeed *= 0.99; }
                else if(horse.type === 'oikomi') { currentSpeed *= 0.98; }

                if (horse === currentLeader && horse.currentStamina > 0) {
                    // 風抵抗ペナルティマイルド化
                    let windResistance = currentCourseId === 'basic' ? 1.30 : 1.22; 
                    staminaCost *= windResistance;
                    currentSpeed *= 0.985; 

                    let closestDist = 999;
                    allHorses.forEach(other => {
                        if (other === horse) return;
                        let distDiff = horse.run_dist - other.run_dist;
                        if (distDiff > 0 && distDiff < closestDist) closestDist = distDiff;
                    });
                    
                    if (closestDist > 15) {
                        currentSpeed *= 0.965; 
                    } else if (closestDist < 10) {
                        currentSpeed *= 1.035; 
                        staminaCost *= 1.05; 
                    }
                }

            } else { 
                let distToLeader = currentLeader.run_dist - horse.run_dist;
                let spurtMod = horse.makuriTriggered ? 1.002 : (horse.isChokusenIkki ? 1.06 : 1.0); 
                let spurtStaminaMod = horse.makuriTriggered ? 1.25 : (horse.isChokusenIkki ? 0.9 : 1.0); // スパート時のまくりスタミナ負荷軽減
                let spurtSpeedMulti = 1.0;
                let spurtStaminaCost = 1.0;
                
                let courseSpurtMod = currentCourseId === 'basic' ? 1.12 : 0.95; // スパート全体のスタミナ消費倍率引き下げ
                
                let spStNige = 1.20, spStSenko = 1.25, spStSashi = 1.35, spStOikomi = 1.45; // スパートスタミナ基準値全体引き下げ
                if (currentCourseId === 'basic') {
                    spStNige = 1.28;
                    spStSenko = 1.28;
                    spStSashi = 1.10; 
                    spStOikomi = 1.02; 
                }

                if(horse.type === 'nige') { spurtSpeedMulti = 0.92 * horse.spurt; spurtStaminaCost = spStNige * courseSpurtMod; }
                else if(horse.type === 'senko') { spurtSpeedMulti = 1.03 * horse.spurt; spurtStaminaCost = spStSenko * courseSpurtMod; }
                else if(horse.type === 'sashi') { spurtSpeedMulti = 1.15 * horse.spurt * spurtMod; spurtStaminaCost = spStSashi * spurtStaminaMod * courseSpurtMod; }
                else if(horse.type === 'oikomi') { spurtSpeedMulti = 1.25 * horse.spurt * spurtMod; spurtStaminaCost = spStOikomi * spurtStaminaMod * courseSpurtMod; }

                let catchUpBonus = 1.0;
                if (distToLeader > 3 && horse.currentStamina > 0) {
                    let catchUpRate = currentCourseId === 'basic' ? 0.0060 : 0.0020; 
                    
                    if (!horse.makuriTriggered && (horse.type === 'sashi' || horse.type === 'oikomi') && horse.currentStamina > 25) {
                        catchUpRate *= 1.3;
                    }

                    catchUpBonus = 1.0 + (distToLeader * catchUpRate); 
                    let maxCatchUpSpurt = currentCourseId === 'basic' ? 1.30 : 1.13; 
                    catchUpBonus = Math.min(maxCatchUpSpurt, catchUpBonus); 
                    
                    if (currentCourseId === 'basic' && (horse.type === 'oikomi' || horse.type === 'sashi')) {
                        catchUpBonus *= 1.04;
                    }
                }
                
                if (remainToGoal < 100 && horse.currentStamina > 0 && distToLeader > 0) {
                    catchUpBonus *= currentCourseId === 'basic' ? 1.03 : 1.025; 
                    if (remainToGoal < 30) {
                        catchUpBonus *= 1.02;
                    }
                }

                let leaderPenalty = 1.0;
                if (currentCourseId === 'sonoda') {
                    if (remainToGoal < 400 && horse === currentLeader) {
                        leaderPenalty = 0.965; 
                    }
                } else {
                    if (remainToGoal < 350 && horse === currentLeader) {
                        leaderPenalty = 0.975; 
                    }
                }

                // ==========================================
                // スタミナ残量による段階的な減速（グラデーション失速）
                // ==========================================
                if (horse.currentStamina > 0) {
                    let staminaFade = 1.0;
                    
                    // スタミナが「35」を切ると、0に向かってジワジワとスピードが低下する（最大0.88倍に緩やかにシフト）
                    if (horse.currentStamina < 35) {
                        let t = horse.currentStamina / 35; // 1.0 (残35) -> 0.0 (残0)
                        staminaFade = 0.88 + 0.12 * t; 
                    }
                    
                    let reserveKire = 1.0;
                    if (!horse.makuriTriggered && (horse.type === 'sashi' || horse.type === 'oikomi') && horse.currentStamina > 20) {
                        reserveKire = 1.0 + (horse.currentStamina - 20) * 0.0015;
                        reserveKire = Math.min(1.06, reserveKire); 
                    }

                    currentSpeed *= (spurtSpeedMulti * staminaFade * catchUpBonus * leaderPenalty * reserveKire);
                    staminaCost = spurtStaminaCost;

                    if (horse === currentLeader) {
                        staminaCost *= currentCourseId === 'basic' ? 1.30 : 1.22; // スパート時先頭負荷緩和
                        currentSpeed *= 0.985;
                        
                        let closestDist = 999;
                        allHorses.forEach(other => {
                            if (other === horse) return;
                            let distDiff = horse.run_dist - other.run_dist;
                            if (distDiff > 0 && distDiff < closestDist) closestDist = distDiff;
                        });
                        
                        if (closestDist > 12) {
                            currentSpeed *= 0.975; 
                        } else if (closestDist < 6) {
                            currentSpeed *= 1.025; 
                        }
                    }
                } else {
                    // スタミナが完全に0になったときだけ、激バテ状態（汗、大幅失速）に移行
                    horse.isSweating = true;
                    horse.exhaustion += 1 * speedMultiplier; 
                    
                    let smoothPenalty;
                    let ex = horse.exhaustion;
                    if (currentCourseId === 'basic') {
                        // 35から緩やかに減速した0.88倍の状態から、さらに疲労蓄積度に応じてズルズルと失速
                        smoothPenalty = 0.88 * Math.max(0.60, 1.0 - (ex * 0.004)); 
                    } else {
                        smoothPenalty = 0.85 * Math.max(0.55, 1.0 - (ex * 0.005)); 
                    }

                    currentSpeed *= (spurtSpeedMulti * smoothPenalty); 
                }
            }

            let targetLane = horse.lane; 
            let horsesAround = 0; 
            let draftTarget = null;
            let minDraftDist = 999;
            let blockingHorses = []; 
            let markTarget = null;
            let minMarkDist = 20.0;
            
            const progress = horse.run_dist / total_dist;
            let finalStraightLen = L;
            const isFinalStraight = remainToGoal < finalStraightLen; 

            allHorses.forEach(other => {
                if (other === horse) return;
                let distDiff = other.run_dist - horse.run_dist;
                let laneDiff = Math.abs(other.lane - horse.lane);

                if (Math.abs(distDiff) < 12 && laneDiff < 1.5) { 
                    horsesAround++;
                }
                if (distDiff > 2 && distDiff < 20 && laneDiff < 1.0) {
                    if (currentSurface === 'dirt') {
                        horse.isSandCovered = true; 
                    } else {
                        horse.isDrafting = true; 
                    }
                }
                if (distDiff > 0 && distDiff < 30) {
                    blockingHorses.push(other);
                }
                if (progress < 0.75 && distDiff >= 15 && distDiff < 40) { 
                    if (distDiff < minDraftDist) {
                        minDraftDist = distDiff;
                        draftTarget = other;
                    }
                }
                
                if (distDiff > 0 && distDiff < minMarkDist && laneDiff < 1.5) {
                    minMarkDist = distDiff;
                    markTarget = other;
                }
                
                if (remainToGoal <= finalStraightLen && Math.abs(distDiff) < 8 && laneDiff < 1.5 && horse.currentStamina > 0) {
                    horse.isBattling = true;
                }
                if (remainToGoal <= spurtDist + 200 && horse === currentLeader && distDiff > -15 && distDiff <= 0 && horse.currentStamina > 0) {
                    horse.isBattling = true;
                }
            });

            let baseTargetLane = horse.lane;
            
            if (draftTarget && progress < 0.75) {
                let offset = ((horse.horseNum * 1.3) % 1.6) - 0.8; 
                baseTargetLane = Math.max(0, Math.min(8.0, draftTarget.lane + offset));
            } else {
                if (isFinalStraight) {
                    if (currentCourseId === 'basic') {
                        if (horse.finalTargetLane === undefined) {
                            let spreadBase = 3.0 + (horse.horseNum % 10) * 1.0; 
                            if (horse.type === 'oikomi') spreadBase += 4.5; 
                            if (horse.type === 'sashi') spreadBase += 2.5;  
                            if (horse.type === 'nige') spreadBase = 1.0;   
                            horse.finalTargetLane = spreadBase;
                        }
                        baseTargetLane = horse.finalTargetLane;
                    } else {
                        baseTargetLane = horse.lane; 
                    }
                } else if (progress > 0.03) {
                    let personalInner = 0.5 + ((horse.horseNum * 1.7) % 2.5); 
                    
                    if (horse.run_dist < 600) {
                        if (currentCourseId === 'sonoda') {
                            if (horse.courseType === 'in' && Math.random() > 0.4) {
                                personalInner = 0.0 + ((horse.horseNum * 1.0) % 1.0); 
                            } else {
                                personalInner = 1.5 + ((horse.horseNum * 1.0) % 1.5); 
                            }
                        } else {
                            personalInner = 0.2 + ((horse.horseNum * 1.0) % 1.5); 
                        }
                    } else {
                        if (currentCourseId === 'sonoda') {
                            if (horse.courseType === 'in' && Math.random() > 0.4) {
                                personalInner = 0.0 + ((horse.horseNum * 1.0) % 1.0); 
                            } else {
                                personalInner += 1.5; 
                            }
                        }
                        if (horse.courseType === 'out' && progress > 0.4) {
                            personalInner += 1.5; 
                        }
                    }
                    baseTargetLane = personalInner;
                }
            }

            if (horse.makuriTriggered && currentCourseId === 'sonoda') {
                baseTargetLane = Math.max(baseTargetLane, 6.5 + ((horse.horseNum % 4) * 0.5)); 
            }

            targetLane = horse.lane;
            if (Math.abs(horse.lane - baseTargetLane) > 0.3) {
                targetLane = horse.lane + (baseTargetLane - horse.lane) * 0.08; 
            }

            // 3コーナー〜4コーナーの間はお互いの隙間をギュッと狭めて（0.55）走ることで、外への大膨らみを防いで一団の馬群を保つ
            let requiredClearance = 0.8; 
            if (remainToGoal < threeCornerDist && remainToGoal >= finalStraightLen) {
                requiredClearance = 0.55; 
            }

            let blocker = null;
            let minBlockDist = 25; 

            for (let other of blockingHorses) {
                let distDiff = other.run_dist - horse.run_dist;
                if (Math.abs(other.lane - targetLane) < requiredClearance && distDiff < minBlockDist) {
                    blocker = other;
                    minBlockDist = distDiff;
                }
            }

            if (blocker) {
                horse.blocked = true;
                let checkLanes = [
                    horse.lane + 1.0, horse.lane - 1.0, 
                    horse.lane + 1.6, horse.lane - 1.6,
                    horse.lane + 2.2, horse.lane - 2.2
                ];
                
                let foundPath = false;
                let avoidMaxLane = (progress < 0.60) ? 7.5 : 21.0; 
                if (horse.run_dist < 600) avoidMaxLane = 4.5;

                for (let testLane of checkLanes) {
                    if (testLane < 0 || testLane > avoidMaxLane) continue;
                    
                    let isClear = true;
                    for (let other of blockingHorses) {
                        let distDiff = other.run_dist - horse.run_dist;
                        if (distDiff < 22 && Math.abs(other.lane - testLane) < requiredClearance) {
                            isClear = false; 
                            break;
                        }
                    }
                    
                    if (isClear) {
                        targetLane = testLane; 
                        if (isFinalStraight && currentCourseId === 'basic') {
                            horse.finalTargetLane = targetLane;
                        }
                        foundPath = true;
                        break;
                    }
                }
                
                if (!foundPath) {
                    currentSpeed = Math.min(currentSpeed, horse.actualSpeedBase * 0.85);
                    horse.currentStamina -= 0.08 * speedMultiplier; // 詰まり時のスタミナペナルティ軽減
                    horse.isStressed = true; 
                }
            }

            if (remainToGoal > spurtDist && markTarget && horse.currentStamina > 0 && !horse.makuriTriggered) {
                if (minMarkDist > 4.0 && minMarkDist < 18.0 && markTarget.currentVelocity > horse.currentVelocity) {
                    let followPaceMod = cPace === 'high' ? 1.5 : 1.0;
                    let followBonus = 1.0 + (minMarkDist - 4.0) * 0.0015 * followPaceMod; 
                    currentSpeed *= followBonus; 
                    staminaCost *= (1.0 + 0.015 * followPaceMod); 
                    
                    if (minMarkDist > 8.0 && Math.random() < 0.05) { horse.isBattling = true; }
                }
            }

            if (horse.isDrafting && !horse.isSweating) { staminaCost *= 0.5; currentSpeed *= 1.06; }
            if (horse.isSandCovered) { staminaCost *= 1.15; horse.isStressed = true; }

            if (remainToGoal > 400 && horse !== currentLeader) {
                let currentDistToLeader = currentLeader.run_dist - horse.run_dist;
                if (horse.makuriTriggered) {
                    if (currentDistToLeader < 2.0) {
                        currentSpeed = Math.min(currentSpeed, currentLeader.currentVelocity * 0.95);
                    } else if (currentDistToLeader < 6.0) {
                        currentSpeed = Math.min(currentSpeed, currentLeader.currentVelocity * 1.01);
                    }
                } else if (remainToGoal > spurtDist && horse.type !== 'nige') {
                    if (currentDistToLeader < 1.5) {
                        currentSpeed = Math.min(currentSpeed, currentLeader.currentVelocity * 0.98);
                    }
                }
            }

            let speedDiff = currentSpeed - horse.currentVelocity;
            let acceleration = 0;

            if (speedDiff > 0) {
                if (horse.currentStamina > 0) {
                    currentSpeed *= (horse === currentLeader) ? 1.055 : 1.035; 
                } else {
                    currentSpeed *= 1.015;  
                }
            }
            
            let moveSpeed = 0.22 * speedMultiplier;
            if (isFinalStraight && horse.currentStamina > 0) {
                moveSpeed = 0.35 * speedMultiplier;
            }
            
            let isShifting = false;
            if (horse.lane < targetLane - 0.1) {
                horse.lane += moveSpeed; 
                isShifting = true;
            } else if (horse.lane > targetLane + 0.1) {
                horse.lane -= moveSpeed; 
                isShifting = true;
            }

            if (isShifting) {
                let shiftPenalty = isFinalStraight ? 0.99 : 0.985;
                currentSpeed *= shiftPenalty;
                staminaCost *= 1.10; // 横移動スタミナペナルティ軽減
            }

            if (horse.lane < 0) horse.lane = 0;
            if (horse.lane > 21) horse.lane = 21; 

            if (currentCourseId === 'sonoda') {
                let sandDepth = Math.max(0, 8.0 - horse.lane) / 8.0; 
                if (sandDepth > 0) {
                    currentSpeed *= (1.0 - 0.06 * sandDepth); 
                    staminaCost *= (1.0 + 0.12 * sandDepth); // 砂によるスタミナ負荷軽減
                }
            }

            if (isCorner) {
                let cornerPower = currentCourseId === 'sonoda' ? 1.5 : 1.2;
                currentSpeed *= Math.pow(R / actualR, cornerPower); 
                
                if (horse.lane > 3.0) {
                    let staminaPenalty = currentCourseId === 'sonoda' ? 0.045 : 0.03; // コーナリング時外回りスタミナペナルティをさらに緩和
                    staminaCost *= 1.0 + (horse.lane - 3.0) * staminaPenalty;
                }
            } else {
                if (horse.lane < 3.0 && currentSurface === 'turf') { 
                    currentSpeed *= 1.0 + ((3.0 - horse.lane) * 0.0015); 
                }
            }

            currentSpeed *= (Math.random() * 0.15 + 0.925); 
            
            speedDiff = currentSpeed - horse.currentVelocity;
            acceleration = 0;
            
            if (speedDiff > 0) {
                if (horse.currentStamina <= 0) {
                    acceleration = 0; 
                } else {
                    let baseAccel = 0.015; 
                    if (horse.accelType === 'sharp') baseAccel = 0.025; 
                    else if (horse.accelType === 'smooth') baseAccel = 0.008; 
                    
                    let accelRatio = baseAccel; 
                    
                    if (total_dist <= 1600) accelRatio *= 1.5;
